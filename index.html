<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textile Credit & Collections ERP</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2733; --ink2:#5b6672; --ink3:#8a95a3;
  --line:#e6e9ee; --line2:#eef1f5; --primary:#2563eb; --primary-d:#1d4ed8;
  --green:#15803d; --green-bg:#e8f5ee; --amber:#b45309; --amber-bg:#fdf1e2;
  --red:#b91c1c; --red-bg:#fdecec; --blue-bg:#e8f0fe; --slate:#334155;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-lg:0 10px 30px rgba(16,24,40,.14);
  --radius:10px; --radius-s:7px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d8e0;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b9c0cc;background-clip:content-box}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:236px;background:#0f1729;color:#c7d0dd;display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:40;transition:width .18s ease}
#sidebar.collapsed{width:64px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px;border-bottom:1px solid #1c2740;height:56px}
.brand .logo{min-width:32px;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#4f83f5);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.brand .btxt{overflow:hidden;white-space:nowrap}
.brand .btxt b{color:#fff;font-size:14px;display:block;line-height:1.1}
.brand .btxt span{font-size:10.5px;color:#7d8aa3;letter-spacing:.3px}
#sidebar.collapsed .btxt,#sidebar.collapsed .nav-label,#sidebar.collapsed .nav-sec{display:none}
.nav{flex:1;overflow-y:auto;padding:10px 10px}
.nav::-webkit-scrollbar{width:6px}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#5c6a86;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#c0cad9;
  cursor:pointer;margin:1px 0;white-space:nowrap;font-weight:500;position:relative}
.nav-item:hover{background:#182238;color:#fff}
.nav-item.active{background:#1d4ed8;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .badge-n{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:10px}
#sidebar.collapsed .nav-item .badge-n{position:absolute;top:4px;right:4px;margin:0;padding:0 4px}
.side-foot{padding:12px;border-top:1px solid #1c2740;font-size:11px;color:#6b7893}

/* ---------- Main ---------- */
#main{flex:1;margin-left:236px;transition:margin-left .18s ease;min-width:0}
#main.collapsed{margin-left:64px}
#topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.searchbar{flex:1;max-width:420px;position:relative}
.searchbar input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 34px;
  font-size:13px;background:#f8f9fb;outline:none}
.searchbar input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--blue-bg)}
.searchbar .si{position:absolute;left:11px;top:9px;color:var(--ink3)}
.search-results{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow-lg);max-height:380px;overflow:auto;z-index:60;display:none}
.search-results.open{display:block}
.sr-group{padding:6px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
  background:#f8f9fb;position:sticky;top:0}
.sr-item{padding:8px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-top:1px solid var(--line2)}
.sr-item:hover{background:var(--blue-bg)}
.sr-item small{color:var(--ink3)}
.spacer{flex:1}
.date-range{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;
  height:36px;padding:0 10px;font-size:12.5px;color:var(--ink2);background:#fff}
.date-range select{border:none;background:transparent;font-size:12.5px;color:var(--ink);outline:none;font-weight:600}
.topuser{display:flex;align-items:center;gap:9px;padding:3px 6px 3px 3px;border-radius:20px;cursor:pointer}
.topuser:hover{background:var(--line2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#334155,#64748b);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.topuser .u-meta{line-height:1.15}
.topuser .u-meta b{font-size:12.5px;display:block}
.topuser .u-meta span{font-size:10.5px;color:var(--ink3)}
.pill-role{font-size:10px;background:var(--blue-bg);color:var(--primary-d);padding:2px 7px;border-radius:20px;font-weight:700}

/* company selector */
.company-sel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;height:36px;
  padding:0 10px;font-size:12.5px;font-weight:600;color:var(--ink)}
.company-sel select{border:none;background:transparent;font-weight:600;outline:none}

/* ---------- Content ---------- */
#view{padding:22px 24px 60px}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px}
.page-head p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.page-head .ph-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);height:36px;padding:0 14px;border-radius:8px;
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--red);border-color:#f3c7c7}
.btn.danger:hover{background:var(--red-bg)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.icon-act{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--ink2);font-size:13px;line-height:1;margin-left:4px}
.icon-act:hover{background:var(--blue-bg);border-color:#cddcfb;color:var(--primary-d)}
.icon-act.danger:hover{background:var(--red-bg);border-color:#f3c7c7;color:var(--red)}
td.row-act{white-space:nowrap;text-align:right}
/* keep the Actions (edit/delete) column pinned to the right so it's always visible */
table.tbl th.col-act{position:sticky;right:0;background:#fafbfc;z-index:3;box-shadow:-9px 0 10px -8px rgba(16,24,40,.16)}
table.tbl td.row-act{position:sticky;right:0;background:#fff;box-shadow:-9px 0 10px -8px rgba(16,24,40,.16)}
table.tbl tbody tr:hover td.row-act{background:#f7f9fc}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-label{font-size:11.5px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .k-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--blue-bg);color:var(--primary)}
.kpi .k-val{font-size:22px;font-weight:750;margin-top:8px;letter-spacing:-.5px}
.kpi .k-sub{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:6px}
.delta{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--green);background:var(--green-bg)}
.delta.down{color:var(--red);background:var(--red-bg)}
.kpi.accent-green .k-ic{background:var(--green-bg);color:var(--green)}
.kpi.accent-amber .k-ic{background:var(--amber-bg);color:var(--amber)}
.kpi.accent-red .k-ic{background:var(--red-bg);color:var(--red)}

/* cards / panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.card-h .sub{font-size:11.5px;color:var(--ink3)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.row-gap{margin-bottom:16px}

/* tables */
.tbl-wrap{overflow:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.7px}
table.tbl th{position:sticky;top:0;background:#fafbfc;text-align:left;padding:10px 12px;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--ink)}
table.tbl th .arr{opacity:.4;font-size:9px;margin-left:3px}
table.tbl th.sorted .arr{opacity:1;color:var(--primary)}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tbl tbody tr{transition:background .08s}
table.tbl tbody tr:hover{background:#f7f9fc}
table.tbl tr.clickable{cursor:pointer}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.t-strong{font-weight:700}
.muted{color:var(--ink3)}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}
.link{color:var(--primary);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--primary-d)}
.b-gray{background:#eef1f5;color:var(--ink2)}
.b-slate{background:#e9edf3;color:var(--slate)}

/* filters bar */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding-left:2px}
select.inp,input.inp{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:12.5px;background:#fff;outline:none;color:var(--ink)}
select.inp:focus,input.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--blue-bg)}
.inp.mini{height:30px;font-size:12px}
.chip-filter{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--primary-d);
  border:1px solid #cddcfb;border-radius:20px;padding:3px 6px 3px 11px;font-size:11.5px;font-weight:600}
.chip-filter b{font-weight:700}
.chip-filter .x{cursor:pointer;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.chip-filter .x:hover{background:#dbe6fd}

/* pagination */
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 4px 0;font-size:12.5px;color:var(--ink2)}
.pager button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--ink2)}
.pager button:hover:not(:disabled){background:var(--line2)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .pg-info{margin-right:auto}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* progress bars */
.mini-bar{height:7px;border-radius:5px;background:#eef1f5;overflow:hidden;min-width:70px}
.mini-bar>span{display:block;height:100%;border-radius:5px}
.util-wrap{display:flex;align-items:center;gap:8px}

/* mini stat cards */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.stat .lb{font-size:11px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat .vl{font-size:19px;font-weight:750;margin-top:5px;letter-spacing:-.4px}
.stat .sm{font-size:11px;color:var(--ink3);margin-top:2px}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(15,23,41,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;
  display:flex;flex-direction:column;animation:pop .16s ease}
.modal.lg{max-width:820px}
.modal.xl{max-width:1000px}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2)}
.modal-h h3{margin:0;font-size:16px;font-weight:700}
.modal-h .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:8px;border:none;background:var(--line2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.modal-h .x:hover{background:#e2e6ec}
.modal-b{padding:20px;overflow:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc;border-radius:0 0 14px 14px}

.drawer-ov{position:fixed;inset:0;background:rgba(15,23,41,.42);z-index:110;display:none}
.drawer-ov.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:#fff;box-shadow:var(--shadow-lg);
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:111}
.drawer.open{transform:none}
.drawer-h{padding:17px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.drawer-h h3{margin:0;font-size:16px;font-weight:700}
.drawer-h .x{margin-left:auto;width:32px;height:32px;border-radius:8px;border:none;background:var(--line2);color:var(--ink2);font-size:16px}
.drawer-b{padding:20px;overflow:auto;flex:1}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row{display:flex;flex-direction:column;gap:5px}
.form-row.full{grid-column:1 / -1}
.form-row label{font-size:12px;font-weight:600;color:var(--ink2)}
.form-row label .req{color:var(--red)}
.form-row input,.form-row select,.form-row textarea{height:38px;border:1px solid var(--line);border-radius:8px;
  padding:0 11px;font-size:13px;outline:none;background:#fff;font-family:inherit;color:var(--ink)}
.form-row textarea{height:auto;padding:9px 11px;resize:vertical}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--blue-bg)}
.form-row .err{font-size:11px;color:var(--red);font-weight:600;display:none}
.form-alert{background:var(--red-bg);border:1px solid #f3c7c7;color:var(--red);border-radius:9px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.form-row.invalid input,.form-row.invalid select{border-color:var(--red)}
.form-row.invalid .err{display:block}

/* FIFO preview blocks */
.alloc-line{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;background:#fff}
.alloc-line .inv-b{min-width:96px}
.alloc-line .inv-b b{font-size:12.5px}
.alloc-line .inv-b small{display:block;color:var(--ink3);font-size:11px}
.alloc-line .flow{flex:1}
.alloc-line .amt-tag{text-align:right}
.settle-full{border-left:3px solid var(--green)}
.settle-part{border-left:3px solid var(--amber)}

/* fifo timeline */
.fifo-node{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;position:relative}
.fifo-receipt{border-left:3px solid var(--primary);background:#f7faff}
.fifo-arrow{text-align:center;color:var(--primary);font-size:18px;margin:2px 0;font-weight:700}
.fifo-inv{margin-left:26px;border-left:3px solid var(--green)}
.fifo-inv.part{border-left-color:var(--amber)}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;
  box-shadow:var(--shadow-lg);padding:12px 15px;min-width:280px;max-width:380px;display:flex;gap:11px;align-items:flex-start;
  animation:slidein .25s ease}
.toast.ok{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--red)}
.toast .t-ic{width:22px;height:22px;flex-shrink:0}
.toast b{font-size:13px}
.toast p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* calc rows */
.calc-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.calc-row:last-child{border-bottom:none}
.calc-row .lbl{color:var(--ink2)}
.calc-row .val{font-weight:700;font-variant-numeric:tabular-nums}
.calc-total{background:var(--green-bg);border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;
  align-items:center;margin-top:12px}
.calc-total .lbl{font-weight:700;color:var(--green)}
.calc-total .val{font-size:19px;font-weight:800;color:var(--green)}
.rule-badge{background:var(--blue-bg);border:1px solid #cddcfb;border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--primary-d);margin:12px 0}

/* empty / loading */
.empty{text-align:center;padding:46px 20px;color:var(--ink3)}
.empty .e-ic{font-size:34px;opacity:.5;margin-bottom:8px}
.empty b{color:var(--ink2);display:block;font-size:14px;margin-bottom:3px}
.skeleton{background:linear-gradient(90deg,#eef1f5 25%,#f6f8fa 50%,#eef1f5 75%);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;
  animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.chart-box{position:relative;height:260px}
.chart-box.sm{height:210px}
.legend-inline{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend-inline span{display:flex;align-items:center;gap:6px}
.legend-inline i{width:10px;height:10px;border-radius:3px;display:inline-block}

.tt{position:relative;cursor:help;border-bottom:1px dotted var(--ink3)}

<script>
/*==================================================================================
  TEXTILE CREDIT & COLLECTIONS ERP  —  single-file interactive prototype
  Shared data model + FIFO replay engine. All views derive from one dataset.
==================================================================================*/
"use strict";
/*------------------ Lightweight self-contained chart engine (Chart.js-subset) ------------------*/
(function(){
  function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}
  let TT=null;
  function tip(){if(!TT){TT=document.createElement('div');TT.style.cssText='position:fixed;z-index:500;pointer-events:none;background:#0f1729;color:#fff;font:12px Inter,sans-serif;padding:7px 10px;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;white-space:nowrap;transition:opacity .08s';document.body.appendChild(TT);}return TT;}
  function Chart(canvas,config){
    this.canvas=canvas;this.config=config;this.ctx=canvas.getContext('2d');
    this._hot=[];this._bound=this._render.bind(this);
    window.addEventListener('resize',this._bound);
    this._mm=this._onMove.bind(this);this._cl=this._onClick.bind(this);this._lv=()=>{tip().style.display='none';};
    canvas.addEventListener('mousemove',this._mm);canvas.addEventListener('click',this._cl);canvas.addEventListener('mouseleave',this._lv);
    this._render();
  }
  Chart.defaults={font:{family:'Inter, sans-serif'},color:'#5b6672',plugins:{legend:{labels:{usePointStyle:true,boxWidth:8,padding:14}},tooltip:{}}};
  Chart.prototype.destroy=function(){window.removeEventListener('resize',this._bound);
    this.canvas.removeEventListener('mousemove',this._mm);this.canvas.removeEventListener('click',this._cl);this.canvas.removeEventListener('mouseleave',this._lv);tip().style.display='none';};
  Chart.prototype._fmtY=function(v){const cb=this.config.options&&this.config.options.scales&&this.config.options.scales.y&&this.config.options.scales.y.ticks&&this.config.options.scales.y.ticks.callback;return cb?cb(v):v;};
  Chart.prototype._tipLabel=function(ctx){const o=this.config.options;const cb=o&&o.plugins&&o.plugins.tooltip&&o.plugins.tooltip.callbacks&&o.plugins.tooltip.callbacks.label;return cb?cb(ctx):(ctx.label+': '+ctx.raw);};
  Chart.prototype._render=function(){
    const cv=this.canvas,ctx=this.ctx,parent=cv.parentElement;if(!parent)return;
    const dpr=window.devicePixelRatio||1;const W=parent.clientWidth||300,H=parent.clientHeight||220;
    cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    this._hot=[];this.W=W;this.H=H;
    if(this.config.type==='doughnut')this._doughnut(W,H);else this._bar(W,H);
  };
  Chart.prototype._bar=function(W,H){
    const ctx=this.ctx,cfg=this.config,labels=cfg.data.labels,ds=cfg.data.datasets;
    const padL=48,padR=12,padT=12,padB=26;
    const plotW=W-padL-padR,plotH=H-padT-padB;
    let max=0;labels.forEach((_,i)=>ds.forEach(d=>{max=Math.max(max,d.data[i]||0)}));
    const ymax=niceMax(max)||10;const ticks=4;
    ctx.strokeStyle='#eef1f5';ctx.fillStyle='#8a95a3';ctx.font='11px Inter, sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    for(let t=0;t<=ticks;t++){const val=ymax/ticks*t;const y=padT+plotH-(val/ymax)*plotH;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
      let lbl=this._fmtY(val);ctx.fillText(lbl,padL-8,y);}
    const groups=labels.length;const gw=plotW/groups;const nds=ds.length;
    const groupInner=gw*0.62;const barW=groupInner/nds;
    ctx.textAlign='center';ctx.textBaseline='top';
    for(let i=0;i<groups;i++){
      const gx=padL+gw*i+gw/2;
      ds.forEach((d,di)=>{
        const v=d.data[i]||0;const bh=(v/ymax)*plotH;const x=gx-groupInner/2+barW*di;const y=padT+plotH-bh;
        const col=Array.isArray(d.backgroundColor)?d.backgroundColor[i]:d.backgroundColor;
        ctx.fillStyle=col||'#2563eb';roundRect(ctx,x+1,y,barW-2,bh,Math.min(4,barW/2));ctx.fill();
        this._hot.push({x,y,w:barW,h:bh,rectTop:padT,rectH:plotH,index:i,datasetIndex:di,
          ctx:{raw:v,label:labels[i],dataset:{label:d.label}}});
      });
      ctx.fillStyle='#8a95a3';ctx.font='11px Inter, sans-serif';
      let xl=labels[i];if(xl.length>7&&groups>8)xl=xl.slice(0,6);
      ctx.fillText(xl,gx,padT+plotH+6);
    }
  };
  Chart.prototype._doughnut=function(W,H){
    const ctx=this.ctx,cfg=this.config,d=cfg.data.datasets[0],labels=cfg.data.labels;
    const legend=cfg.options&&cfg.options.plugins&&cfg.options.plugins.legend&&cfg.options.plugins.legend.position==='right';
    const legendW=legend?Math.min(160,W*0.42):0;
    const cx=(W-legendW)/2,cy=H/2,R=Math.min((W-legendW),H)/2-8;
    const cutStr=(cfg.options&&cfg.options.cutout)||'62%';const inner=R*(parseFloat(cutStr)/100);
    const total=d.data.reduce((a,b)=>a+b,0)||1;let a0=-Math.PI/2;
    d.data.forEach((v,i)=>{const a1=a0+(v/total)*Math.PI*2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
      ctx.fillStyle=d.backgroundColor[i];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      this._hot.push({slice:true,cx,cy,R,inner,a0,a1,index:i,ctx:{raw:v,label:labels[i],dataset:{label:d.label}}});
      a0=a1;});
    ctx.beginPath();ctx.fillStyle='#fff';ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1f2733';ctx.font='700 15px Inter, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    if(cfg.options&&cfg.options._centerTitle)ctx.fillText(cfg.options._centerTitle,cx,cy);
    if(legend){let ly=cy-labels.length*11;ctx.textAlign='left';ctx.textBaseline='middle';
      labels.forEach((l,i)=>{ctx.fillStyle=d.backgroundColor[i];roundRect(ctx,W-legendW+4,ly-5,10,10,2);ctx.fill();
        ctx.fillStyle='#5b6672';ctx.font='11.5px Inter, sans-serif';ctx.fillText(l,W-legendW+20,ly);ly+=22;});}
  };
  Chart.prototype._hit=function(e){const r=this.canvas.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
    for(const h of this._hot){
      if(h.slice){const dx=mx-h.cx,dy=my-h.cy;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<=h.R&&dist>=h.inner){let ang=Math.atan2(dy,dx);const start=Math.atan2(Math.sin(h.a0),Math.cos(h.a0));let a=ang;
        // normalize angle range
        let a0=h.a0,a1=h.a1;while(a<a0)a+=Math.PI*2;if(a>=a0&&a<=a1)return h;}}
      else{if(mx>=h.x&&mx<=h.x+h.w&&my>=h.rectTop&&my<=h.rectTop+h.rectH)return h;}
    }return null;};
  Chart.prototype._onMove=function(e){const h=this._hit(e);const t=tip();
    if(h){t.innerHTML=this._tipLabel(h.ctx);t.style.display='block';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY-10)+'px';this.canvas.style.cursor=(this.config.options&&this.config.options.onClick)?'pointer':'default';}
    else{t.style.display='none';this.canvas.style.cursor='default';}};
  Chart.prototype._onClick=function(e){const h=this._hit(e);const oc=this.config.options&&this.config.options.onClick;if(h&&oc)oc(e,[{index:h.index,datasetIndex:h.datasetIndex}]);};
  function roundRect(ctx,x,y,w,h,r){if(h<0){y+=h;h=-h;}r=Math.min(r,w/2,h/2);if(h<r)r=h;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  window.Chart=Chart;
})();

const TODAY = new Date(2026,7,9); // 09 Aug 2026 (month 0-indexed)
const DAY = 86400000;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RND = mulberry32(20260809);
function rand(a,b){return a+(b-a)*RND()}
function randi(a,b){return Math.floor(rand(a,b+1))}
function pick(arr){return arr[Math.floor(RND()*arr.length)]}
function round(n,d){const p=Math.pow(10,d||0);return Math.round(n*p)/p}
function r1000(n){return Math.round(n/1000)*1000}
function daysBetween(a,b){return Math.round((b-a)/DAY)}
function addDays(d,n){return new Date(d.getTime()+n*DAY)}
function fmtDate(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateShort(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
function egp(n){if(n==null||isNaN(n))return '—';const s=Math.round(n).toLocaleString('en-US');return 'EGP '+s}
function egp0(n){return Math.round(n).toLocaleString('en-US')}
function pct(n){return (n).toFixed(1)+'%'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/*----------------------------------- SEED DATA -----------------------------------*/
const REP_NAMES=["Ahmed Hassan","Mohamed Ali","Omar Khaled","Mahmoud Adel","Karim Samir","Youssef Tarek","Mostafa Ibrahim","Amr Hany"];
const CUST_NAMES=["Nile Garments","Cairo Fashion Factory","Delta Textile Trading","Alexandria Apparel","Lotus Uniforms",
"Egyptian Knitwear Co.","Pharaoh Textiles","Giza Cotton Mills","Mansoura Weaving","Suez Sportswear",
"Red Sea Fabrics","Zamalek Fashion House","Heliopolis Garments","Tanta Textile Co.","Damietta Denim",
"Nile Delta Spinning","Cairo Cotton Exports","Maadi Manufacturing","Sphinx Apparel","Luxor Linens",
"Aswan Textiles","October Uniforms","Ramses Clothing","Nefertiti Fashions","Port Said Trading",
"Ismailia Garments","Fayoum Fabrics","Sohag Spinning","Minya Mills","Beni Suef Textiles",
"Qena Clothing","Cleopatra Couture"];

const PAY_METHODS=["Bank Transfer","Cheque","Cash","Card"];
const BANKS=["CIB — Main","QNB — Cash","Banque Misr","NBE Collection","Cash Drawer"];

const DB = {
  salespersons:[], customers:[], invoices:[], collections:[],
  allocations:[], commissionTxns:[],
  commissionRules:[], bonusRules:[], creditSettings:{}, roles:[], users:[],
  commissionStatusOverride:{}, // key -> status
  // ---- v2 additions: inventory + custom commission ----
  products:[], productVariants:[], inventoryMovements:[], invoiceLines:[], customCommissions:[],
  seqInvoice:1000, seqReceipt:1000, seqCollection:0, seqInvId:0,
  seqProduct:0, seqVariant:0, seqMovement:0, seqLine:0, seqCustom:0,
  // business-rule flags kept explicit (not silently assumed) — see Settings → Business Rules
  ruleFlags:{ allowNegativeStock:false, reassignMovesHistory:false }
};
const CATEGORIES=["T-Shirts","Polo Shirts","Hoodies","Trousers","Uniforms","Knitwear","Denim","Activewear"];
const COLORS=["Black","White","Navy","Grey","Olive","Beige","Red","Sky Blue"];
const SIZES=["S","M","L","XL","XXL"];
// CONFIRMED discount/commission model — a product belongs to exactly one discount type.
const DISCOUNT_TYPES=['Basic','Custom','No Discount'];
const BASIC_MIN=20, BASIC_MAX=25; // confirmed customer Basic Discount range
// Basic products earn Basic Commission (auto engine); Custom & No-Discount earn Custom Commission (manual/flexible).
function commissionTypeFor(discountType){return discountType==='Basic'?'Basic':'Custom';}
function discountTypeOf(productId){const p=productById(productId);return p&&p.discountType?p.discountType:'Basic';} // variants inherit product type; legacy default Basic
function dtypeBadge(t){const map={'Basic':'b-blue','Custom':'b-amber','No Discount':'b-slate'};return `<span class="badge ${map[t]||'b-gray'}">${t}</span>`;}
function basicDiscountValid(pct){return pct>=BASIC_MIN&&pct<=BASIC_MAX;}

function seed(){
  // Sales reps
  REP_NAMES.forEach((n,i)=>{
    DB.salespersons.push({id:i+1,name:n,employeeCode:'SP-'+String(i+1).padStart(2,'0'),status:'Active',
      salesTarget:r1000(rand(1000000,1700000)), collectionTarget:r1000(rand(900000,1500000))});
  });
  // Customers
  CUST_NAMES.forEach((n,i)=>{
    const disc = RND()<0.55?20:25;
    const terms = pick([30,30,45,45,60]);
    const cl = r1000(rand(350000,1600000));
    DB.customers.push({id:i+1,code:'CUST-'+String(i+1).padStart(3,'0'),name:n,
      salespersonId:randi(1,8),discountPercent:disc,creditLimit:cl,paymentTerms:terms,
      city:pick(CITIES),contact:'+20 1'+randi(0,2)+' '+randi(1000,9999)+' '+randi(1000,9999),
      status:'Active'});
  });
  // profiles govern collection lag + paid fraction => spread across aging & day buckets
  const profiles=[
    {name:'fast',lag:[8,26],frac:[0.88,1.0]},
    {name:'normal',lag:[26,52],frac:[0.70,0.9]},
    {name:'normal',lag:[26,52],frac:[0.70,0.9]},
    {name:'slow',lag:[56,88],frac:[0.5,0.72]},
    {name:'delinquent',lag:[95,175],frac:[0.15,0.45]}
  ];
  DB.customers.forEach(c=>{
    const prof = c.id%9===0 ? profiles[4] : pick(profiles);
    c._profile=prof.name;
    const nInv = randi(3,7);
    const invs=[];
    for(let k=0;k<nInv;k++){
      // bias toward recent invoices so aging & statuses spread realistically
      const ageDays = RND()<0.52 ? randi(4,88) : randi(80,330); // invoice age from today
      const idt = addDays(TODAY,-ageDays);
      const amt = r1000(rand(45,320)*1000);
      DB.seqInvId++;
      const inv={id:DB.seqInvId,invoiceNumber:'INV-'+(++DB.seqInvoice),customerId:c.id,salespersonId:c.salespersonId,
        invoiceDate:idt,dueDate:addDays(idt,c.paymentTerms),amount:amt,collected:0,balance:amt,status:'Open',
        docStatus:'Confirmed',discount:0,currency:'EGP',notes:'',stockPosted:false};
      invs.push(inv);DB.invoices.push(inv);
    }
    invs.sort((a,b)=>a.invoiceDate-b.invoiceDate);
    // generate collections that pay a prefix (FIFO) with lag
    const total=invs.reduce((s,x)=>s+x.amount,0);
    const frac=rand(prof.frac[0],prof.frac[1]);
    let target=r1000(total*frac);
    // cumulative invoice boundaries for dating
    let cum=0;const bounds=invs.map(x=>{cum+=x.amount;return{date:x.invoiceDate,upto:cum}});
    let collected=0,guard=0;
    while(target-collected>2000 && guard<20){
      guard++;
      let chunk=r1000(rand(35,240)*1000);
      chunk=Math.min(chunk,target-collected);
      if(chunk<5000)break;
      // which invoice is being settled at this cumulative point
      const at=collected+chunk*0.4;
      let bi=bounds.find(b=>at<=b.upto)||bounds[bounds.length-1];
      const lag=randi(prof.lag[0],prof.lag[1]);
      let cd=addDays(bi.date,lag+randi(-4,6));
      if(cd>addDays(TODAY,-1))cd=addDays(TODAY,-randi(1,10));
      if(cd<=bi.date)cd=addDays(bi.date,randi(3,12));
      DB.seqCollection++;
      DB.collections.push({id:DB.seqCollection,receiptNumber:'RCPT-'+(++DB.seqReceipt),customerId:c.id,
        salespersonId:c.salespersonId,collectionDate:cd,amount:chunk,paymentMethod:pick(PAY_METHODS),
        bankAccount:pick(BANKS),reference:'REF'+randi(100000,999999),notes:''});
      collected+=chunk;
    }
  });
  // sort collections globally by date for stable receipt ordering display
  DB.collections.sort((a,b)=>a.collectionDate-b.collectionDate || a.id-b.id);

  // Default commission rules (source of truth from spec)
  let crid=1;
  [[20,0,30,4],[20,31,60,3],[20,61,90,2],[20,91,null,0],
   [25,0,30,3],[25,31,60,2],[25,61,90,1],[25,91,null,0]].forEach(r=>{
     DB.commissionRules.push({id:crid++,discountPercent:r[0],minDays:r[1],maxDays:r[2],commissionPercent:r[3],active:true});
  });
  // Bonus rules (threshold points for interpolation)
  let brid=1;
  [[30,2.0],[45,1.5],[60,1.0],[90,0]].forEach(r=>DB.bonusRules.push({id:brid++,collectionDays:r[0],bonusPercent:r[1],active:true}));
  DB.bonusInterpolate=true;

  DB.creditSettings={defaultCreditLimit:500000,defaultTerms:30,warnThreshold:80,blockThreshold:100,graceDays:5};
  DB.roles=[
    {name:'Administrator',users:2,perms:'Full access to all modules, settings & user management'},
    {name:'Finance Manager',users:3,perms:'View all data, approve & pay commissions, edit rules'},
    {name:'Accountant',users:5,perms:'Record collections, view AR & invoices, no rule editing'},
    {name:'Sales Manager',users:2,perms:'View all sales reps, commissions & bonuses'},
    {name:'Sales Representative',users:8,perms:'View only own customers, invoices & commissions'},
    {name:'Viewer',users:4,perms:'Read-only dashboards & reports'}
  ];
  DB.users=[
    {name:'Mostafa Adel',email:'m.adel@textileco.eg',role:'Finance Manager',status:'Active'},
    {name:'Sara Fouad',email:'s.fouad@textileco.eg',role:'Administrator',status:'Active'},
    {name:'Hossam Nabil',email:'h.nabil@textileco.eg',role:'Accountant',status:'Active'},
    {name:'Nourhan Adel',email:'n.adel@textileco.eg',role:'Sales Manager',status:'Active'},
    {name:'Ahmed Hassan',email:'a.hassan@textileco.eg',role:'Sales Representative',status:'Active',salespersonId:1},
    {name:'Laila Mansour',email:'l.mansour@textileco.eg',role:'Viewer',status:'Invited'}
  ];
  seedInventory();
  seedCustomCommissions();
}
const PRODUCT_SEED=[

function custById(id){return DB.customers.find(c=>c.id===id)}
function repById(id){return DB.salespersons.find(s=>s.id===id)}
function invById(id){return DB.invoices.find(i=>i.id===id)}
// Safe display helpers — never throw when a referenced record is missing (e.g. unassigned salesperson,
// a customer whose rep was removed, a legacy row). Used in all render/label contexts.
function repName(id){const s=repById(id);return s?s.name:'— Unassigned —';}
function repFirst(id){const s=repById(id);return s?String(s.name||'').split(' ')[0]:'—';}
function custName(id){const c=custById(id);return c?c.name:'— Unknown —';}
function invNo(id){const i=invById(id);return i?i.invoiceNumber:'—';}

function commissionRuleFor(discount,days){
  return DB.commissionRules.find(r=>r.active && r.discountPercent===discount &&
    days>=r.minDays && (r.maxDays==null || days<=r.maxDays));
}
function commissionRateFor(discount,days){const r=commissionRuleFor(discount,days);return r?r.commissionPercent:0}

function bonusPercentFor(avgDays){
  const pts=DB.bonusRules.filter(r=>r.active).slice().sort((a,b)=>a.collectionDays-b.collectionDays);
  if(!pts.length)return 0;
  if(avgDays<=pts[0].collectionDays)return pts[0].bonusPercent;
  const last=pts[pts.length-1];
  if(avgDays>=last.collectionDays)return last.bonusPercent;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    if(avgDays>=a.collectionDays&&avgDays<=b.collectionDays){
      if(!DB.bonusInterpolate)return a.bonusPercent;
      const t=(avgDays-a.collectionDays)/(b.collectionDays-a.collectionDays);
      return a.bonusPercent+t*(b.bonusPercent-a.bonusPercent);
    }
  }
  return last.bonusPercent;
}

// Core replay: rebuild allocations, commissions, balances & statuses from base records
function isConfirmed(i){return (i.docStatus||'Confirmed')==='Confirmed';}
function rebuild(){
  DB.invoices.forEach(inv=>{inv.collected=0;inv.balance=inv.amount;inv.status='Open';inv._alloc=[]});
  DB.allocations=[];DB.commissionTxns=[];
  let aId=1,cId=1;
  const cols=DB.collections.slice().sort((a,b)=>a.collectionDate-b.collectionDate||a.id-b.id);
  cols.forEach(col=>{
    col._alloc=[];
    let remaining=col.amount;
    const cust=custById(col.customerId);
    if(!cust){col.unapplied=col.amount;return;} // orphan collection (customer missing) — skip safely, never crash
    // FIFO allocates only to CONFIRMED (posted) invoices — drafts/cancelled never receive payment
    const open=DB.invoices.filter(i=>i.customerId===col.customerId&&isConfirmed(i)&&i.balance>0.5)
      .sort((a,b)=>a.invoiceDate-b.invoiceDate||a.id-b.id);
    for(const inv of open){
      if(remaining<=0.5)break;
      const alloc=Math.min(remaining,inv.balance);
      inv.collected+=alloc;inv.balance-=alloc;remaining-=alloc;
      const cd=Math.max(0,daysBetween(inv.invoiceDate,col.collectionDate));
      const a={id:aId++,collectionId:col.id,invoiceId:inv.id,allocatedAmount:alloc,
        invoiceDate:inv.invoiceDate,collectionDate:col.collectionDate,collectionDays:cd};
      DB.allocations.push(a);inv._alloc.push(a);col._alloc.push(a);
      const stFor=(k)=>{let st=DB.commissionStatusOverride[k];if(!st){const ageOfCol=daysBetween(col.collectionDate,TODAY);st=ageOfCol>75?'Paid':ageOfCol>25?'Approved':'Calculated';}return st;};
      // ---- Line-aware BASIC COMMISSION ----
      // Only Basic-type lines earn Basic Commission, using each line's Basic-discount snapshot (not the current
      // customer discount). Custom / No-Discount lines earn Custom Commission (handled by the custom_commissions module).
      const lines=linesOf(inv.id);
      const netOf=l=>(l.netLineTotal!=null?l.netLineTotal:l.lineTotal);
      const basicLines=lines.filter(l=>(l.commissionType||commissionTypeFor(l.discountType||'Basic'))==='Basic');
      if(lines.length){
        const totalNet=lines.reduce((s,l)=>s+netOf(l),0)||inv.amount;
        const mixed=lines.some(l=>(l.commissionType||commissionTypeFor(l.discountType||'Basic'))!=='Basic');
        basicLines.forEach(l=>{
          // PROVISIONAL: a collection pays down the whole invoice; the Basic share is apportioned proportionally by net.
          const share=totalNet>0?alloc*(netOf(l)/totalNet):0;
          const dpct=(l.appliedDiscountPercent!=null?l.appliedDiscountPercent:cust.discountPercent);
          const rate=commissionRateFor(dpct,cd);
          const key=col.id+'-'+inv.id+'-'+l.id;
          DB.commissionTxns.push({id:cId++,allocationId:a.id,salespersonId:col.salespersonId,customerId:col.customerId,
            invoiceId:inv.id,invoiceLineId:l.id,collectionId:col.id,allocatedAmount:share,collectionDays:cd,
            discountPercent:dpct,rate,commissionAmount:share*rate/100,status:stFor(key),key,provApportion:mixed});
        });
      } else {
        // LEGACY invoice with no line items — preserve the original invoice-level Basic Commission behavior exactly.
        const rate=commissionRateFor(cust.discountPercent,cd);const key=col.id+'-'+inv.id;
        DB.commissionTxns.push({id:cId++,allocationId:a.id,salespersonId:col.salespersonId,customerId:col.customerId,
          invoiceId:inv.id,invoiceLineId:null,collectionId:col.id,allocatedAmount:alloc,collectionDays:cd,
          discountPercent:cust.discountPercent,rate,commissionAmount:alloc*rate/100,status:stFor(key),key});
      }
    }
    col.unapplied=remaining;
  });
  DB.invoices.forEach(inv=>{
    if(!isConfirmed(inv)){inv.status=inv.docStatus;return;} // Draft / Cancelled shown as-is
    if(inv.balance<=0.5){inv.status='Fully Collected';}
    else if(TODAY>inv.dueDate){inv.status='Overdue';}
    else if(inv.collected>0.5){inv.status='Partially Collected';}
    else inv.status='Open';
  });
  if(typeof persist==='function')persist();
}

// aging bucket by days past due for an open invoice
function agingBucket(inv){
  if(inv.balance<=0.5)return null;
  const pastDue=daysBetween(inv.dueDate,TODAY);
  if(pastDue<=0)return 'current';
  if(pastDue<=30)return 'b30';
  if(pastDue<=60)return 'b60';
  if(pastDue<=90)return 'b90';
  return 'b90p';
}
const AGING_KEYS=['current','b30','b60','b90','b90p'];
const AGING_LABELS={current:'Current',b30:'1–30 Days',b60:'31–60 Days',b90:'61–90 Days',b90p:'90+ Days'};

function customerMetrics(c){
  const invs=DB.invoices.filter(i=>i.customerId===c.id&&isConfirmed(i)); // financial figures = confirmed invoices only
  const totalSales=invs.reduce((s,i)=>s+i.amount,0);
  const collected=invs.reduce((s,i)=>s+i.collected,0);
  const outstanding=invs.reduce((s,i)=>s+i.balance,0);
  const overdue=invs.filter(i=>i.status==='Overdue').reduce((s,i)=>s+i.balance,0);
  const openInvs=invs.filter(i=>i.balance>0.5).sort((a,b)=>a.invoiceDate-b.invoiceDate);
  const oldest=openInvs[0]||null;
  const allocs=DB.allocations.filter(a=>invs.some(i=>i.id===a.invoiceId));
  const wsum=allocs.reduce((s,a)=>s+a.allocatedAmount,0);
  const avgDays=wsum>0?allocs.reduce((s,a)=>s+a.collectionDays*a.allocatedAmount,0)/wsum:0;
  const util=c.creditLimit>0?outstanding/c.creditLimit*100:0;
  const aging={};AGING_KEYS.forEach(k=>aging[k]=0);
  openInvs.forEach(i=>{const b=agingBucket(i);if(b)aging[b]+=i.balance});
  let risk='Good';
  if(outstanding>c.creditLimit)risk='Over Limit';
  else if(aging.b90p>0)risk='High Risk';
  else if(util>=DB.creditSettings.warnThreshold||overdue>0)risk='Watch';
  return {totalSales,collected,outstanding,overdue,oldest,avgDays,util,aging,
    availableCredit:c.creditLimit-outstanding,risk,collectionRate:totalSales>0?collected/totalSales*100:0,
    invoiceCount:invs.length,oldestAge:oldest?daysBetween(oldest.invoiceDate,TODAY):0};
}

function salespersonMetrics(s){
  const custs=DB.customers.filter(c=>c.salespersonId===s.id);
  let totalSales=0,collected=0,outstanding=0,overdue=0;
  custs.forEach(c=>{const m=customerMetrics(c);totalSales+=m.totalSales;collected+=m.collected;outstanding+=m.outstanding;overdue+=m.overdue;});
  const comms=DB.commissionTxns.filter(t=>t.salespersonId===s.id);
  const basicCommission=comms.reduce((a,t)=>a+t.commissionAmount,0);
  const customCommission=DB.customCommissions.filter(x=>x.salespersonId===s.id&&x.status!=='Rejected'&&x.status!=='Cancelled').reduce((a,x)=>a+(+x.amount||0),0);
  const commission=basicCommission; // "commission" kept = Basic for backward compatibility
  const totalCommission=basicCommission+customCommission;
  const allocs=DB.allocations.filter(a=>{const inv=invById(a.invoiceId);return inv&&inv.salespersonId===s.id});
  const wsum=allocs.reduce((a,x)=>a+x.allocatedAmount,0);
  const avgDays=wsum>0?allocs.reduce((a,x)=>a+x.collectionDays*x.allocatedAmount,0)/wsum:0;
  const eligible=DB.collections.filter(c=>c.salespersonId===s.id).reduce((a,c)=>a+c.amount,0);
  const bpct=bonusPercentFor(avgDays);
  const bonus=eligible*bpct/100;
  return {customers:custs.length,totalSales,collected,outstanding,overdue,
    basicCommission,customCommission,commission:basicCommission,totalCommission,avgDays,
    bonusPercent:bpct,bonus,eligible,totalPayable:totalCommission+bonus,
    collectionRate:totalSales>0?collected/totalSales*100:0};
}

function globalAging(){
  const a={};AGING_KEYS.forEach(k=>a[k]=0);
  DB.invoices.filter(i=>isConfirmed(i)&&i.balance>0.5).forEach(i=>{const b=agingBucket(i);if(b)a[b]+=i.balance});
  return a;
}
function monthlySeries(){
  // last 12 months sales vs collections
  const months=[];
  for(let k=11;k>=0;k--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-k,1);months.push(d);}
  return months.map(m=>{
    const y=m.getFullYear(),mo=m.getMonth();
    const sales=DB.invoices.filter(i=>isConfirmed(i)&&i.invoiceDate.getFullYear()===y&&i.invoiceDate.getMonth()===mo).reduce((s,i)=>s+i.amount,0);
    const coll=DB.collections.filter(c=>c.collectionDate.getFullYear()===y&&c.collectionDate.getMonth()===mo).reduce((s,c)=>s+c.amount,0);
    return {label:m.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),sales,coll};
  });
}
function companyKPIs(){
  let totalSales=0,collected=0,outstanding=0,overdue=0;
  DB.invoices.filter(isConfirmed).forEach(i=>{totalSales+=i.amount;collected+=i.collected;outstanding+=i.balance;if(i.status==='Overdue')overdue+=i.balance});
  const commission=DB.commissionTxns.reduce((a,t)=>a+t.commissionAmount,0); // Basic
  const customCommission=DB.customCommissions.filter(x=>x.status!=='Rejected'&&x.status!=='Cancelled').reduce((a,x)=>a+(+x.amount||0),0);
  const bonus=DB.salespersons.reduce((a,s)=>a+salespersonMetrics(s).bonus,0);
  const wsum=DB.allocations.reduce((a,x)=>a+x.allocatedAmount,0);
  const avgDays=wsum>0?DB.allocations.reduce((a,x)=>a+x.collectionDays*x.allocatedAmount,0)/wsum:0;
  return {totalSales,collected,outstanding,overdue,commission,basicCommission:commission,customCommission,
    totalCommission:commission+customCommission,bonus,avgDays,
    collectionRate:totalSales>0?collected/totalSales*100:0};
}

function productById(id){return DB.products.find(p=>p.id===id)}
function variantById(id){return DB.productVariants.find(v=>v.id===id)}
function variantsOf(pid){return DB.productVariants.filter(v=>v.productId===pid)}
function variantLabel(v){const p=productById(v.productId);return (p?p.name:'?')+' · '+v.color+' / '+v.size}
function auditUser(){return (authRequired&&typeof authRequired==='function'&&authRequired()&&currentUserName)?currentUserName:'Demo User';}
// The ONLY way stock changes — always writes a movement (no silent stock edits)
function applyMovement(variantId,type,qtyIn,qtyOut,opts){
  const v=variantById(variantId);if(!v)return null;
  opts=opts||{};
  const newBal=v.stock+(qtyIn||0)-(qtyOut||0);
  v.stock=newBal;
  DB.seqMovement++;
  const mv={id:DB.seqMovement,date:opts.date||TODAY,productId:v.productId,variantId:v.id,type,
    qtyIn:qtyIn||0,qtyOut:qtyOut||0,balanceAfter:newBal,reference:opts.reference||'',invoiceId:opts.invoiceId||null,
    user:opts.user||auditUser(),notes:opts.notes||'',createdAt:fmtDate(TODAY)};
  DB.inventoryMovements.push(mv);
  if(secureMode&&typeof secureMode==='function'&&secureMode()){
    // Write parents before child so DB foreign keys never reject the movement insert
    // (movement → product, → variant, and → invoice when it came from an invoice).
    const prod=productById(v.productId);
    (async()=>{try{
      if(prod)await sbUpsert('products',TMAP.products.to(prod));
      await sbUpsert('product_variants',TMAP.product_variants.to(v));
      if(mv.invoiceId){const inv=invById(mv.invoiceId);if(inv)await sbUpsert('invoices',TMAP.invoices.to(inv));}
      await sbUpsert('inventory_movements',TMAP.inventory_movements.to(mv));
    }catch(e){}})();
  }
  return mv;
}
function variantStatus(v){ if(v.stock<=0)return 'out'; if(v.stock<=v.reorderLevel)return 'low'; return 'ok'; }
function inventorySummary(){
  const variants=DB.productVariants;
  return {products:DB.products.length,variants:variants.length,
    units:variants.reduce((a,v)=>a+v.stock,0),
    low:variants.filter(v=>variantStatus(v)==='low').length,
    out:variants.filter(v=>variantStatus(v)==='out').length,
    stockValue:variants.reduce((a,v)=>a+v.stock*(v.price||0),0)};
}
function nextProductCode(){const n=DB.products.reduce((m,p)=>Math.max(m,parseInt((p.code||'').replace(/\D/g,''))||0),0)+1;return 'PRD-'+String(n).padStart(3,'0');}
// invoice line helpers
function linesOf(invId){return DB.invoiceLines.filter(l=>l.invoiceId===invId)}
function lineGross(l){return (l.grossLineAmount!=null?l.grossLineAmount:(l.qty*l.unitPrice));}
function lineNet(l){return (l.netLineTotal!=null?l.netLineTotal:l.lineTotal);}
function lineDisc(l){return (l.discountAmount!=null?l.discountAmount:(l.lineDiscount||0));}
function invoiceGross(invId){return linesOf(invId).reduce((a,l)=>a+lineGross(l),0)}
function invoiceDiscountTotal(invId){return linesOf(invId).reduce((a,l)=>a+lineDisc(l),0)}
function invoiceSubtotal(invId){return linesOf(invId).reduce((a,l)=>a+lineNet(l),0)}
// custom commission compute
function customCommissionAmount(rec){ return rec.type==='Percentage'? round((+rec.baseAmount||0)*(+rec.percentage||0)/100,2) : (+rec.amount||0); }

const SORT={};
function sortData(arr,key,dir){
  return arr.slice().sort((a,b)=>{
    let x=a[key],y=b[key];
    if(typeof x==='string'){x=x.toLowerCase();y=y.toLowerCase();return dir*(x<y?-1:x>y?1:0);}
    return dir*((x||0)-(y||0));
  });
}

function resetCustFilters(){Object.assign(custState,{search:'',rep:'',disc:'',risk:'',bucket:'',page:1});PAGES.customers();}
function refreshCust(){renderCustTable(DB.customers.map(c=>({c,m:customerMetrics(c)})));}
function filterCust(rows){
  return rows.filter(({c,m})=>{
    if(!inScope(c.salespersonId))return false;
    if(custState.search){const q=custState.search.toLowerCase();if(!(c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)))return false;}
    if(custState.rep&&c.salespersonId!=custState.rep)return false;
    if(custState.disc&&c.discountPercent!=custState.disc)return false;
    if(custState.risk&&m.risk!==custState.risk)return false;
    if(custState.bucket&&!(m.aging[custState.bucket]>0))return false;
    return true;
  });
}
function renderCustTable(rows){
  let data=filterCust(rows);
  const sk=custState.sortKey,dir=custState.sortDir;
  data.sort((a,b)=>{
    const map={name:['c','name'],code:['c','code'],disc:['c','discountPercent'],creditLimit:['c','creditLimit']};
    let x,y;
    if(map[sk]){x=a[map[sk][0]][map[sk][1]];y=b[map[sk][0]][map[sk][1]];}
    else{x=a.m[sk];y=b.m[sk];}
    if(typeof x==='string'){x=x.toLowerCase();y=y.toLowerCase();return dir*(x<y?-1:x>y?1:0);}
    return dir*((x||0)-(y||0));
  });
  const total=data.length,per=custState.per;
  const pages=Math.max(1,Math.ceil(total/per));
  if(custState.page>pages)custState.page=pages;
  const slice=data.slice((custState.page-1)*per,custState.page*per);
  const cols=[
    ['code','Code',0],['name','Customer',0],['rep','Salesperson',0],['disc','Disc%',1],
    ['creditLimit','Credit Limit',1],['totalSales','Total Sales',1],['collected','Collected',1],
    ['outstanding','Outstanding',1],['availableCredit','Avail. Credit',1],['oldestAge','Oldest Inv',1],
    ['avgDays','Avg Days',1],['risk','Risk',0]];
  const th=cols.map(c=>{
    const sortable=['code','name','disc','creditLimit','totalSales','collected','outstanding','availableCredit','oldestAge','avgDays'].includes(c[0]);
    const sorted=custState.sortKey===c[0];
    return `<th class="${c[2]?'num':''} ${sortable?'sortable':''} ${sorted?'sorted':''}" ${sortable?`onclick="custSort('${c[0]}')"`:''}>${c[1]}${sortable?`<span class="arr">${sorted?(custState.sortDir<0?'▼':'▲'):'↕'}</span>`:''}</th>`;
  }).join('');
  const body=slice.length?slice.map(({c,m})=>`
    <tr class="clickable" onclick="go('customer',{id:${c.id}})">
      <td class="t-strong">${c.code}</td>
      <td><b>${esc(c.name)}</b><br><small class="muted">${c.city}</small></td>
      <td>${esc(repName(c.salespersonId))}</td>
      <td class="num"><span class="badge b-gray">${c.discountPercent}%</span></td>
      <td class="num">${egp0(c.creditLimit)}</td>
      <td class="num">${egp0(m.totalSales)}</td>
      <td class="num pos">${egp0(m.collected)}</td>
      <td class="num t-strong">${egp0(m.outstanding)}</td>
      <td class="num ${m.availableCredit<0?'neg':''}">${egp0(m.availableCredit)}</td>
      <td class="num">${m.oldest?m.oldestAge+'d':'—'}</td>
      <td class="num">${m.avgDays?Math.round(m.avgDays):'—'}</td>
      <td>${riskBadge(m.risk)}</td>
      ${rowActions('customer',c.id)}
    </tr>`).join(''):`<tr><td colspan="13"><div class="empty"><div class="e-ic">&#128269;</div><b>No customers match</b>Try adjusting filters</div></td></tr>`;
  document.getElementById('custTable').innerHTML=`
    <div class="tbl-wrap"><table class="tbl"><thead><tr>${th}${canEdit()?'<th class="num col-act">Actions</th>':''}</tr></thead><tbody>${body}</tbody></table></div>
    ${pager(total,custState.page,pages,'cust')}`;
}
function custSort(k){if(custState.sortKey===k)custState.sortDir*=-1;else{custState.sortKey=k;custState.sortDir=['name','code'].includes(k)?1:-1;}refreshCust();}
function custPage(p){custState.page=p;refreshCust();}
function pager(total,page,pages,ns){
  if(total<=0)return '';
  return `<div class="pager"><span class="pg-info">Showing ${(page-1)*10+1}–${Math.min(total,page*10)} of ${total}</span>
    <button onclick="${ns}Page(1)" ${page<=1?'disabled':''}>&#171;</button>
    <button onclick="${ns}Page(${page-1})" ${page<=1?'disabled':''}>&#8249;</button>
    <span>Page ${page} / ${pages}</span>
    <button onclick="${ns}Page(${page+1})" ${page>=pages?'disabled':''}>&#8250;</button>
    <button onclick="${ns}Page(${pages})" ${page>=pages?'disabled':''}>&#187;</button></div>`;
}

function rcOpenInvoices(custId){
  return DB.invoices.filter(i=>i.customerId===custId&&i.balance>0.5).sort((a,b)=>a.invoiceDate-b.invoiceDate||a.id-b.id);
}
function computeFifoPreview(custId,amount,date){
  const cust=custById(custId);if(!cust)return {alloc:[],remaining:amount,totalComm:0,open:[]};
  const open=rcOpenInvoices(custId);
  let remaining=amount;const alloc=[];let totalComm=0;
  for(const inv of open){
    if(remaining<=0.5)break;
    const a=Math.min(remaining,inv.balance);
    const cd=Math.max(0,daysBetween(inv.invoiceDate,date));
    const rate=commissionRateFor(cust.discountPercent,cd);
    const comm=a*rate/100;totalComm+=comm;
    alloc.push({inv,alloc:a,newBal:inv.balance-a,days:cd,rate,comm});
    remaining-=a;
  }
  return {alloc,remaining,totalComm,open};
}
function updateRcPreview(){
  const custId=+document.getElementById('rc_cust').value;
  const amount=+document.getElementById('rc_amount').value||0;
  const date=new Date(document.getElementById('rc_date').value||TODAY);
  const box=document.getElementById('rc_preview');
  const saveBtn=document.getElementById('rc_save');
  if(!custId){box.innerHTML=`<div class="section-note">Select a customer to see their open invoices (oldest first).</div>`;saveBtn.disabled=true;return;}
  const cust=custById(custId);
  if(!cust){box.innerHTML=`<div class="section-note">Customer not found — please re-select.</div>`;saveBtn.disabled=true;return;}
  const open=rcOpenInvoices(custId);
  let html=`<div class="card" style="margin-top:6px"><div class="card-h"><h3>Open Invoices — ${esc(cust.name)}</h3><span class="sub">${cust.discountPercent}% discount · oldest → newest</span></div>
    <div class="card-b" style="padding:0"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Invoice</th><th>Date</th><th class="num">Original</th><th class="num">Balance</th><th class="num">Age</th></tr></thead>
    <tbody>${open.length?open.map(i=>`<tr><td class="t-strong">${i.invoiceNumber}</td><td>${fmtDate(i.invoiceDate)}</td>
      <td class="num">${egp0(i.amount)}</td><td class="num t-strong">${egp0(i.balance)}</td><td class="num">${daysBetween(i.invoiceDate,TODAY)}d</td></tr>`).join(''):
      `<tr><td colspan="5"><div class="empty"><b>No open invoices</b>This customer has no outstanding balance</div></td></tr>`}</tbody></table></div></div></div>`;
  const totalOpen=open.reduce((s,i)=>s+i.balance,0);
  if(amount>0&&open.length){
    const {alloc,remaining,totalComm}=computeFifoPreview(custId,amount,date);
    html+=`<div class="grid-2" style="margin-top:14px">
      <div class="card"><div class="card-h"><h3>&#9889; Auto FIFO Allocation</h3></div><div class="card-b">
        ${alloc.map(a=>`<div class="alloc-line ${a.newBal<=0.5?'settle-full':'settle-part'}">
          <div class="inv-b"><b>${a.inv.invoiceNumber}</b><small>bal ${egp0(a.inv.balance)}</small></div>
          <div class="flow"><b class="pos">Allocate ${egp(a.alloc)}</b><div class="muted" style="font-size:11px">Remaining ${egp0(a.newBal)} ${a.newBal<=0.5?'· settled':''}</div></div>
        </div>`).join('')}
        ${remaining>0.5?`<div class="section-note" style="margin:8px 0 0;border-color:#f3c7c7;background:var(--red-bg);color:var(--red)">&#9888; EGP ${egp0(remaining)} exceeds open balance and cannot be allocated. Reduce the amount.</div>`:''}
      </div></div>
      <div class="card"><div class="card-h"><h3>&#128181; Commission Preview</h3></div><div class="card-b">
        ${alloc.map(a=>`<div class="calc-row"><span class="lbl"><b>${a.inv.invoiceNumber}</b> · ${a.days} days · <span class="badge b-blue">${a.rate}%</span></span><span class="val pos">${egp(a.comm)}</span></div>`).join('')}
        <div class="calc-total"><span class="lbl">Total Commission Generated</span><span class="val">${egp(totalComm)}</span></div>
      </div></div></div>`;
    saveBtn.disabled = remaining>0.5 || amount<=0;
  }else{
    saveBtn.disabled = !(amount>0&&open.length);
  }
  if(amount>totalOpen&&open.length){/* handled above */}
  box.innerHTML=html;
}
function saveRecordCollection(){
  const custId=+document.getElementById('rc_cust').value;
  const amount=+document.getElementById('rc_amount').value||0;
  const dateVal=document.getElementById('rc_date').value;
  let bad=false;
  const setInvalid=(id,cond)=>{const row=document.getElementById(id).closest('.form-row');row.classList.toggle('invalid',cond);if(cond)bad=true;};
  setInvalid('rc_cust',!custId);setInvalid('rc_amount',!(amount>0));

function needsReviewCount(){return DB.products.filter(p=>p.discountReviewed===false).length;}

  const s=inventorySummary();

  <div class="kpi-grid" style="grid-template-columns:repeat(6,1fr);gap:10px">
    <div class="kpi" style="padding:12px"><span class="k-label" style="font-size:10.5px">Total Products</span><div class="k-val" style="font-size:18px;margin-top:6px">${s.products}</div></div>
    <div class="kpi" style="padding:12px"><span class="k-label" style="font-size:10.5px">Total Variants</span><div class="k-val" style="font-size:18px;margin-top:6px">${s.variants}</div></div>
    <div class="kpi accent-green" style="padding:12px"><span class="k-label" style="font-size:10.5px">Units in Stock</span><div class="k-val" style="font-size:18px;margin-top:6px">${egp0(s.units)}</div></div>

    <div class="kpi accent-red" style="padding:12px" role="button" onclick="prodState.tab='variants';prodState.stock='out';PAGES.inventory()"><span class="k-label" style="font-size:10.5px">Out of Stock</span><div class="k-val" style="font-size:18px;margin-top:6px">${s.out}</div></div>
    <div class="kpi" style="padding:12px"><span class="k-label" style="font-size:10.5px">Stock Value</span><div class="k-val" style="font-size:15px;margin-top:7px">${egp(s.stockValue)}</div></div>
  </div>
  <div class="card"><div class="card-b">
    <div class="tabs" style="margin-bottom:14px">
      <div class="tab ${prodState.tab==='products'?'active':''}" onclick="prodState.tab='products';prodState.page=1;PAGES.inventory()">Products</div>

      <div class="fld"><label>Size</label><select class="inp" id="pf_size"><option value="">All</option>${sizes.map(c=>`<option ${prodState.size===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fld"><label>Stock</label><select class="inp" id="pf_stock"><option value="">All</option><option value="low" ${prodState.stock==='low'?'selected':''}>Low stock</option><option value="out" ${prodState.stock==='out'?'selected':''}>Out of stock</option><option value="in" ${prodState.stock==='in'?'selected':''}>In stock</option></select></div>

  renderInvTableBox();
};
function resetProdFilters(){Object.assign(prodState,{search:'',category:'',color:'',size:'',stock:'',dtype:'',page:1});PAGES.inventory();}
function matchDtype(p){if(!prodState.dtype)return true;if(prodState.dtype==='__review')return p.discountReviewed===false;return (p.discountType||'Basic')===prodState.dtype;}
function invPageBox(p){prodState.page=p;renderInvTableBox();}
function matchVariantFilters(v){
  const p=productById(v.productId);if(!p)return false;
  const q=prodState.search.toLowerCase();
  if(q&&!(p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||v.sku.toLowerCase().includes(q)||v.color.toLowerCase().includes(q)||v.size.toLowerCase().includes(q)))return false;
  if(prodState.category&&p.category!==prodState.category)return false;
  if(prodState.color&&v.color!==prodState.color)return false;
  if(prodState.size&&v.size!==prodState.size)return false;
  if(!matchDtype(p))return false;
  if(prodState.stock){const st=variantStatus(v);if(prodState.stock==='in'&&st==='out')return false;if(prodState.stock!=='in'&&st!==prodState.stock)return false;}
  return true;
}
function renderInvTableBox(){
  const box=document.getElementById('invTableBox');
  if(prodState.tab==='variants'){
    let data=DB.productVariants.filter(matchVariantFilters).sort((a,b)=>a.sku.localeCompare(b.sku));
    const per=12,total=data.length,pages=Math.max(1,Math.ceil(total/per));if(prodState.page>pages)prodState.page=pages;
    const slice=data.slice((prodState.page-1)*per,prodState.page*per);
    const body=slice.length?slice.map(v=>{const p=productById(v.productId);const st=variantStatus(v);
      return `<tr class="clickable" onclick="go('product',{id:${v.productId}})">
      <td class="t-strong">${v.sku}</td><td>${esc(p.name)}</td><td>${dtypeBadge(discountTypeOf(v.productId))}</td><td>${v.color}</td><td>${v.size}</td>
      <td class="num">${egp0(v.price)}</td><td class="num t-strong ${st==='out'?'neg':''}">${v.stock}</td>
      <td class="num muted">${v.reorderLevel}</td><td>${invStatusBadge(st)}</td>
      ${can('adjustStock')?`<td class="num row-act" onclick="event.stopPropagation()"><button class="icon-act" title="Adjust stock" onclick="openStockAdjust(${v.id})">&#9878;</button>${can('editProducts')?`<button class="icon-act" title="Edit variant" onclick="openVariantForm(${v.productId},${v.id})">&#9998;</button>`:''}</td>`:''}
      </tr>`;}).join(''):`<tr><td colspan="10"><div class="empty"><div class="e-ic">&#128230;</div><b>No variants match</b></div></td></tr>`;
    box.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>SKU</th><th>Product</th><th>Disc. Type</th><th>Color</th><th>Size</th><th class="num">Price</th><th class="num">Stock</th><th class="num">Reorder</th><th>Status</th>${can('adjustStock')?'<th class="num col-act">Actions</th>':''}</tr></thead><tbody>${body}</tbody></table></div>
      ${pagerBox(total,prodState.page,pages)}`;
  }else{
    let prods=DB.products.filter(p=>{
      const q=prodState.search.toLowerCase();
      if(prodState.category&&p.category!==prodState.category)return false;
      if(!matchDtype(p))return false;
      const vs=variantsOf(p.id);
      if(prodState.color&&!vs.some(v=>v.color===prodState.color))return false;
      if(prodState.size&&!vs.some(v=>v.size===prodState.size))return false;
      if(prodState.stock){const has=vs.some(v=>{const st=variantStatus(v);return prodState.stock==='in'?st!=='out':st===prodState.stock;});if(!has)return false;}
      if(q&&!(p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q)||vs.some(v=>v.sku.toLowerCase().includes(q)||v.color.toLowerCase().includes(q))))return false;
      return true;
    });
    const body=prods.length?prods.map(p=>{const vs=variantsOf(p.id);const units=vs.reduce((a,v)=>a+v.stock,0);
      const low=vs.filter(v=>variantStatus(v)==='low').length,out=vs.filter(v=>variantStatus(v)==='out').length;
      return `<tr class="clickable" onclick="go('product',{id:${p.id}})">
      <td class="t-strong">${p.code}</td><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.brand||'')}</small></td>
      <td><span class="badge b-gray">${p.category}</span></td>
      <td>${dtypeBadge(p.discountType||'Basic')}${p.discountReviewed===false?' <span class="badge b-amber" title="Migrated default — review">review</span>':''}</td>
      <td class="num">${vs.length}</td>
      <td class="num t-strong">${units}</td><td class="num">${egp0(p.defaultPrice)}</td>
      <td>${out?`<span class="badge b-red">${out} out</span> `:''}${low?`<span class="badge b-amber">${low} low</span>`:(!out?'<span class="badge b-green">OK</span>':'')}</td>
      <td>${p.active?'<span class="badge b-green">Active</span>':'<span class="badge b-gray">Inactive</span>'}</td>
      ${can('editProducts')?`<td class="num row-act" onclick="event.stopPropagation()"><button class="icon-act" title="Edit product" onclick="openProductForm(${p.id})">&#9998;</button></td>`:''}
      </tr>`;}).join(''):`<tr><td colspan="10"><div class="empty"><div class="e-ic">&#128230;</div><b>No products match</b>${can('editProducts')?' · <span class="link" onclick="openProductForm()">Add a product</span>':''}</div></td></tr>`;
    box.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Product</th><th>Category</th><th>Disc. Type</th><th class="num">Variants</th><th class="num">Units</th><th class="num">Base Price</th><th>Stock</th><th>Status</th>${can('editProducts')?'<th class="num col-act">Actions</th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
}

function downloadInvTemplate(){
  const t='Product Code,Product Name,Category,Discount Type,Variant SKU,Color,Size,Selling Price,Opening Stock Quantity,Reorder Level\nPRD-101,Oversized T-Shirt,T-Shirts,Basic,PRD-101-BK-M,Black,M,260,50,15\nPRD-101,Oversized T-Shirt,T-Shirts,Basic,PRD-101-BK-L,Black,L,260,30,15\n';
  const blob=new Blob([t],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='inventory-template.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Template downloaded','Fill inventory-template.csv and import','ok');

function normDtype(v){v=(v||'').trim().toLowerCase();if(v==='custom')return {t:'Custom',ok:true};if(v==='no discount'||v==='nodiscount'||v==='none')return {t:'No Discount',ok:true};if(v==='basic')return {t:'Basic',ok:true};return {t:'Basic',ok:false};}
function runInventoryImport(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let objs;try{objs=csvToObjects(rd.result);}catch(e){toast('Parse error',e.message,'err');return;}
    const errs=[];let addedP=0,addedV=0,skipped=0;
    const norm=o=>({code:(o.productcode||'').trim(),name:(o.productname||'').trim(),cat:(o.category||'').trim(),dtype:(o.discounttype||'').trim(),
      sku:(o.variantsku||'').trim(),color:(o.color||'').trim(),size:(o.size||'').trim(),
      price:csvNum(o.sellingprice),stock:csvNum(o.openingstockquantity),reorder:csvNum(o.reorderlevel)});
    objs.forEach((o,i)=>{const r=norm(o);const rn=i+2;
      if(!r.name||!r.sku||!r.color||!r.size){errs.push('Row '+rn+': missing name/SKU/color/size');return;}
      if(DB.productVariants.some(v=>v.sku.toLowerCase()===r.sku.toLowerCase())){skipped++;return;} // never overwrite
      let prod=r.code?DB.products.find(p=>p.code.toLowerCase()===r.code.toLowerCase()):null;
      if(!prod)prod=DB.products.find(p=>p.name.toLowerCase()===r.name.toLowerCase());
      if(!prod){const dt=normDtype(r.dtype);if(r.dtype&&!dt.ok)errs.push('Row '+rn+': unknown Discount Type "'+r.dtype+'" — defaulted to Basic (needs review)');
        DB.seqProduct++;prod=stampCreate({id:DB.seqProduct,code:r.code||nextProductCode(),name:r.name,category:r.cat||'Uncategorised',brand:'',description:'',defaultPrice:r.price,discountType:dt.t,discountReviewed:!!(r.dtype&&dt.ok),active:true,notes:''});DB.products.push(prod);addedP++;}
      DB.seqVariant++;const nv={id:DB.seqVariant,productId:prod.id,sku:r.sku,color:r.color,size:r.size,price:r.price||prod.defaultPrice,stock:0,reorderLevel:r.reorder||0,active:true};
      DB.productVariants.push(nv);addedV++;
      if(r.stock>0)applyMovement(nv.id,'Opening Balance',r.stock,0,{reference:'IMPORT',notes:'Opening inventory import'});
    });
    renderNav();
    const box=document.getElementById('inv_imp_result');
    if(box)box.innerHTML=`<div class="section-note" style="border-color:${errs.length?'#f3c7c7':'#bfe6cf'};background:${errs.length?'var(--red-bg)':'var(--green-bg)'};color:${errs.length?'var(--red)':'var(--green)'}">
      <b>Imported ${addedV} variants across ${addedP} new products.</b> ${skipped?skipped+' existing SKUs skipped. ':''}${errs.length?errs.length+' rows had errors:<br>'+errs.slice(0,8).map(esc).join('<br>'):' No errors.'}</div>`;
    if(secureMode()){DB.products.forEach(p=>securePush('product',p));DB.productVariants.forEach(v=>securePush('variant',v));}
    toast('Inventory import complete',addedV+' variants added'+(skipped?', '+skipped+' skipped':''),addedV?'ok':'warn');
  };
  rd.onerror=()=>toast('Read error','Could not read the file','err');
  rd.readAsText(file);
}

function commCustomerOptions(){
  let list=DB.customers.slice();
  if(commState.rep)list=list.filter(c=>c.salespersonId==commState.rep);

}
function resetCommFilters(){Object.assign(commState,{rep:'',cust:'',invoice:'',receipt:'',disc:'',status:'',dayRange:'',dateFrom:'',dateTo:'',page:1});PAGES.commissions();}
function clearCommFilter(key){commState[key]=key==='rep'?'':commState[key];commState[key]='';commState.page=1;PAGES.commissions();}
function commPage(p){commState.page=p;renderCommTable();}
function filterComm(){
  let d=DB.commissionTxns.slice();
  if(SCOPE)d=d.filter(t=>t.salespersonId===SCOPE);
  if(commState.rep)d=d.filter(t=>t.salespersonId==commState.rep);
  if(commState.cust)d=d.filter(t=>t.customerId==commState.cust);
  if(commState.invoice){const q=commState.invoice.toLowerCase();d=d.filter(t=>invNo(t.invoiceId).toLowerCase().includes(q));}
  if(commState.receipt){const q=commState.receipt.toLowerCase();d=d.filter(t=>{const c=DB.collections.find(x=>x.id===t.collectionId);return c&&c.receiptNumber.toLowerCase().includes(q);});}
  if(commState.disc)d=d.filter(t=>t.discountPercent==commState.disc);
  if(commState.status)d=d.filter(t=>t.status===commState.status);
  if(commState.dayRange){const[a,b]=commState.dayRange.split('-');const lo=+a,hi=b===''?Infinity:+b;d=d.filter(t=>t.collectionDays>=lo&&t.collectionDays<=hi);}
  if(commState.dateFrom){const from=parseDateInput(commState.dateFrom);d=d.filter(t=>{const c=DB.collections.find(x=>x.id===t.collectionId);return c&&c.collectionDate>=from;});}
  if(commState.dateTo){const to=parseDateInput(commState.dateTo);to.setHours(23,59,59);d=d.filter(t=>{const c=DB.collections.find(x=>x.id===t.collectionId);return c&&c.collectionDate<=to;});}
  return d.sort((x,y)=>y.collectionDays-x.collectionDays);
}
function renderCommActiveFilters(shown,total){

     <button onclick="commPage(${commState.page+1})" ${commState.page>=pages?'disabled':''}>&#8250;</button></div>`;

function bulkApproveCommissions(){
  let n=0;DB.commissionTxns.forEach(t=>{if(t.status==='Calculated'){DB.commissionStatusOverride[t.key]='Approved';t.status='Approved';n++;}});

function openCommissionCalc(txnId){
  const t=DB.commissionTxns.find(x=>x.id===txnId);if(!t)return;
  const inv=invById(t.invoiceId)||{invoiceNumber:'—',invoiceDate:TODAY};
  const col=DB.collections.find(c=>c.id===t.collectionId)||{receiptNumber:'—',collectionDate:TODAY};
  const cust=custById(t.customerId)||{name:'— Unknown —',code:''};
  const rule=commissionRuleFor(t.discountPercent,t.collectionDays);
  const rangeTxt=rule?`${rule.minDays}–${rule.maxDays==null?'∞':rule.maxDays} days`:'no matching rule';
  openDrawer('Commission Calculation',`
    <div class="section-note" style="background:var(--blue-bg);border-color:#cddcfb;color:var(--primary-d)">
      Full audit trail — every commission is traceable to a payment allocation, the customer's discount, and the exact rule matched.</div>

    <div class="calc-row"><span class="lbl">Customer</span><span class="val">${esc(cust.name)} (${cust.code})</span></div>
    <div class="calc-row"><span class="lbl">Invoice / Receipt</span><span class="val">${inv.invoiceNumber} · ${col.receiptNumber}</span></div>
    <div class="calc-row"><span class="lbl">Collected (allocated) Amount</span><span class="val">${egp(t.allocatedAmount)}</span></div>
    <div class="calc-row"><span class="lbl">Customer Discount</span><span class="val">${t.discountPercent}%</span></div>
    <div class="calc-row"><span class="lbl">Invoice Date</span><span class="val">${fmtDate(inv.invoiceDate)}</span></div>
    <div class="calc-row"><span class="lbl">Collection Date</span><span class="val">${fmtDate(col.collectionDate)}</span></div>
    <div class="calc-row"><span class="lbl">Collection Days</span><span class="val">${t.collectionDays} days</span></div>
    <div class="rule-badge"><b>Matched Rule:</b> ${t.discountPercent}% discount · ${rangeTxt} → <b>${t.rate}% commission</b></div>
    ${(!rule||t.rate===0)?`<div class="section-note" style="border-color:#f6d68a;background:#fdf6e6;margin:8px 0">${provTag(PROV_ZERO)} &nbsp;This allocation's collection days fall outside the configured bands, so the rate is a <b>provisional 0%</b> pending a confirmed fallback rule.</div>`:''}
    <div class="calc-row"><span class="lbl">Calculation</span><span class="val">${egp0(t.allocatedAmount)} × ${t.rate}%</span></div>
    <div class="calc-total"><span class="lbl">Commission Earned</span><span class="val">${egp(t.commissionAmount)}</span></div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <span class="badge ${t.status==='Paid'?'b-green':t.status==='Approved'?'b-blue':'b-slate'}" style="align-self:center">Status: ${t.status}</span>
      ${t.status!=='Paid'?`<button class="btn sm" onclick="advanceComm('${t.key}')" style="margin-left:auto">${t.status==='Calculated'?'Approve':'Mark Paid'}</button>`:''}
    </div>`);
}
function advanceComm(key){
  const t=DB.commissionTxns.find(x=>x.key===key);if(!t)return;
  const next=t.status==='Calculated'?'Approved':'Paid';
  DB.commissionStatusOverride[key]=next;t.status=next;
  toast('Commission '+next.toLowerCase(),t.status==='Paid'?'Marked as paid':'Moved to approved','ok');
  closeDrawer();
  if(ROUTE.page==='commissions')renderCommTable();else renderView();
}

function toDateInput(d){ // accept 'DD Mon YYYY' or ISO or Date
  if(!d)return dateToInput(TODAY);
  if(/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10);
  const parsed=new Date(d);return isNaN(parsed)?dateToInput(TODAY):dateToInput(parsed);
}
function saveCustomComm(id){

  if(id){const x=DB.customCommissions.find(r=>r.id===id);Object.assign(x,data);stampUpdate(x);securePush('custom',x);toast('Custom commission updated','Saved','ok');}

function openBonusCalc(repId){
  const s=repById(repId);if(!s)return;const m=salespersonMetrics(s);
  const pts=DB.bonusRules.filter(r=>r.active).slice().sort((a,b)=>a.collectionDays-b.collectionDays);
  const avg=m.avgDays;
  // find bracket
  let lower=null,upper=null;
  for(let i=0;i<pts.length-1;i++){if(avg>=pts[i].collectionDays&&avg<=pts[i+1].collectionDays){lower=pts[i];upper=pts[i+1];break;}}
  let interpHtml='';
  if(avg<=pts[0].collectionDays){interpHtml=`<div class="rule-badge">Avg ${Math.round(avg)} days ≤ ${pts[0].collectionDays}-day threshold → top rate <b>${pts[0].bonusPercent}%</b></div>`;}
  else if(avg>=pts[pts.length-1].collectionDays){interpHtml=`<div class="rule-badge" style="background:var(--red-bg);border-color:#f3c7c7;color:var(--red)">Avg ${Math.round(avg)} days ≥ ${pts[pts.length-1].collectionDays}-day threshold → <b>${pts[pts.length-1].bonusPercent}%</b></div>`;}
  else if(lower&&upper){
    const t=(avg-lower.collectionDays)/(upper.collectionDays-lower.collectionDays);
    interpHtml=`<div class="rule-badge"><b>Matched bracket:</b> ${lower.collectionDays}d (${lower.bonusPercent}%) → ${upper.collectionDays}d (${upper.bonusPercent}%)
      ${DB.bonusInterpolate?`<br><br><b>Interpolation:</b> ${lower.bonusPercent}% + (${avg.toFixed(1)}−${lower.collectionDays})/(${upper.collectionDays}−${lower.collectionDays}) × (${lower.bonusPercent}%−${upper.bonusPercent}%)<br>= ${lower.bonusPercent}% + ${(t*100).toFixed(1)}% of the gap = <b>${m.bonusPercent.toFixed(3)}%</b>`:`<br>Interpolation OFF → uses lower threshold <b>${lower.bonusPercent}%</b>`}</div>`;
  }
  openDrawer('Bonus Calculation — '+esc(s.name),`
    <div class="stat-row" style="margin-bottom:16px">
      <div class="stat"><div class="lb">Avg Collection Days</div><div class="vl">${Math.round(avg)}</div></div>
      <div class="stat"><div class="lb">Bonus %</div><div class="vl">${m.bonusPercent.toFixed(3)}%</div></div>
    </div>
    <h3 style="font-size:13px;margin:0 0 8px">Configured thresholds</h3>
    ${pts.map(p=>`<div class="calc-row"><span class="lbl">${p.collectionDays} days</span><span class="val">${p.bonusPercent}%</span></div>`).join('')}
    <h3 style="font-size:13px;margin:16px 0 8px">Matching logic</h3>${interpHtml}
    <div class="calc-row"><span class="lbl">Eligible Collection Amount</span><span class="val">${egp(m.eligible)}</span></div>
    <div class="calc-row"><span class="lbl">Calculation</span><span class="val">${egp0(m.eligible)} × ${m.bonusPercent.toFixed(3)}%</span></div>
    <div class="calc-total"><span class="lbl">Final Bonus</span><span class="val">${egp(m.bonus)}</span></div>`);
}
