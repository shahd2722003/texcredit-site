// Discount & Commission Summary — gross/net split by discount type + Basic/Custom/Total commission, Bonus, Total Payable
function discCommissionData(repf){
  const seg={'Basic':{gross:0,disc:0,net:0,units:0},'Custom':{gross:0,disc:0,net:0,units:0},'No Discount':{gross:0,disc:0,net:0,units:0}};
  DB.invoices.filter(i=>isConfirmed(i)&&(!repf||i.salespersonId===repf)).forEach(inv=>{
    linesOf(inv.id).forEach(l=>{const dt=l.discountType||'Basic';const s=seg[dt]||seg['Basic'];s.gross+=lineGross(l);s.disc+=lineDisc(l);s.net+=lineNet(l);s.units+=(+l.qty||0);});
  });
  const basicComm=DB.commissionTxns.filter(t=>!repf||t.salespersonId===repf).reduce((a,t)=>a+t.commissionAmount,0);
  const custComm=DB.customCommissions.filter(x=>(!repf||x.salespersonId===repf)&&x.status!=='Rejected'&&x.status!=='Cancelled').reduce((a,x)=>a+(+x.amount||0),0);
  const custPending=DB.customCommissions.filter(x=>(!repf||x.salespersonId===repf)&&x.status==='Pending').length;
  let bonus=0;(repf?DB.salespersons.filter(s=>s.id===repf):DB.salespersons).forEach(s=>bonus+=salespersonMetrics(s).bonus);
  return {seg,basicComm,custComm,custPending,bonus};
}
function renderDiscCommissionReport(body,repf){
  const d=discCommissionData(repf);

  const totalComm=d.basicComm+d.custComm;
  body.innerHTML=`
  <div class="section-note" style="border-color:#f6d68a;background:#fdf6e6;border-radius:0;margin:0">${provTag(PROV_BONUS)} &nbsp;Bonus &amp; Total Payable include provisional inputs; Basic Commission apportionment on mixed invoices is also provisional (see Settings → Business Rules).</div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Sales by Discount Type</th><th class="num">Gross Sales</th><th class="num">Total Discount</th><th class="num">Net Sales</th><th class="num">Units</th></tr></thead>

  </table></div>
  <div class="tbl-wrap" style="margin-top:14px"><table class="tbl">
    <thead><tr><th>Commission &amp; Payable</th><th class="num">Amount</th></tr></thead>
    <tbody>
      <tr><td>Basic Commission <span class="muted" style="font-size:11px">(auto engine, from Basic lines)</span></td><td class="num pos t-strong">${egp0(d.basicComm)}</td></tr>
      <tr><td>Custom Commission <span class="muted" style="font-size:11px">(manual; ${d.custPending} pending)</span></td><td class="num pos t-strong">${egp0(d.custComm)}</td></tr>
      <tr style="font-weight:700"><td>Total Commission</td><td class="num">${egp0(totalComm)}</td></tr>

function updRule(id,field,val){const r=DB.commissionRules.find(x=>x.id===id);if(!r)return;
  if(field==='maxDays')r.maxDays=val===''?null:+val;else r[field]=+val;}
function toggleRule(id,btn){const r=DB.commissionRules.find(x=>x.id===id);r.active=!r.active;btn.classList.toggle('on',r.active);}
function deleteRule(id){DB.commissionRules=DB.commissionRules.filter(r=>r.id!==id);renderSettings();}
function addDayRange(disc){const maxId=Math.max(0,...DB.commissionRules.map(r=>r.id));
  const existing=DB.commissionRules.filter(r=>r.discountPercent===disc).sort((a,b)=>a.minDays-b.minDays);
  const lastMax=existing.length?existing[existing.length-1].maxDays:null;
  const from=lastMax!=null?lastMax+1:0;
  DB.commissionRules.push({id:maxId+1,discountPercent:disc,minDays:from,maxDays:from+30,commissionPercent:1,active:true});renderSettings();}
function addDiscountCategory(){
  openModal(`<div class="modal-h"><h3>Add Discount Category</h3><button class="x" data-close>&times;</button></div>
    <div class="modal-b"><div class="form-row"><label>Discount percentage</label><input type="number" id="newDisc" placeholder="e.g. 15, 22, 30"></div>
      <div class="section-note" style="margin-top:12px">A starter 0–30 day range at 3% will be created. You can add more ranges after.</div></div>
    <div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn primary" onclick="confirmAddDiscount()">Add Category</button></div>`);
}
function confirmAddDiscount(){const v=+document.getElementById('newDisc').value;
  if(!v||v<=0){toast('Invalid','Enter a valid discount %','warn');return;}
  if(DB.commissionRules.some(r=>r.discountPercent===v)){toast('Exists','That discount category already exists','warn');return;}
  const maxId=Math.max(0,...DB.commissionRules.map(r=>r.id));
  DB.commissionRules.push({id:maxId+1,discountPercent:v,minDays:0,maxDays:30,commissionPercent:3,active:true});
  closeModal();renderSettings();toast('Category added',v+'% discount category created','ok');}
function removeDiscountCategory(d){DB.commissionRules=DB.commissionRules.filter(r=>r.discountPercent!==d);renderSettings();toast('Category removed',d+'% discount category deleted','ok');}
function validateCommissionRules(){
  const errs=[];const g=discountGroups();
  Object.keys(g).forEach(d=>{
    const rules=g[d].slice().sort((a,b)=>a.minDays-b.minDays);
    for(const r of rules){if(r.maxDays!=null&&r.maxDays<r.minDays)errs.push(`${d}%: a range has To(${r.maxDays}) < From(${r.minDays})`);}
    for(let i=0;i<rules.length-1;i++){const a=rules[i],b=rules[i+1];const aMax=a.maxDays==null?Infinity:a.maxDays;
      if(aMax>=b.minDays)errs.push(`${d}%: ranges ${a.minDays}–${a.maxDays==null?'∞':a.maxDays} and ${b.minDays}–${b.maxDays==null?'∞':b.maxDays} overlap`);}
  });
  return errs;
}
function saveCommissionRules(){
  const errs=validateCommissionRules();
  const errBox=document.getElementById('commRuleErr');
  if(errs.length){errBox.innerHTML=`<div class="section-note" style="border-color:#f3c7c7;background:var(--red-bg);color:var(--red)"><b>Cannot save — fix these:</b><br>${errs.map(e=>'• '+esc(e)).join('<br>')}</div>`;
    toast('Validation failed','Overlapping or invalid ranges','err');return;}
  errBox.innerHTML='';rebuild();renderNav();securePushRules();
  toast('Rules saved','Commission recalculated across all collections','ok');
}

function runSearch(q){
  const box=document.getElementById('searchResults');
  q=q.trim().toLowerCase();
  if(!q){box.classList.remove('open');return;}
  const custs=DB.customers.filter(c=>inScope(c.salespersonId)&&(c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q))).slice(0,5);
  const invs=DB.invoices.filter(i=>inScope(i.salespersonId)&&i.invoiceNumber.toLowerCase().includes(q)).slice(0,5);
  const cols=DB.collections.filter(c=>inScope(c.salespersonId)&&c.receiptNumber.toLowerCase().includes(q)).slice(0,4);
  const reps=(SCOPE?[]:DB.salespersons).filter(s=>s.name.toLowerCase().includes(q)).slice(0,4);
  let html='';
  if(custs.length){html+=`<div class="sr-group">Customers</div>`+custs.map(c=>`<div class="sr-item" onclick="pickSearch('customer',${c.id})"><span><b>${esc(c.name)}</b> <small>${c.code}</small></span><small>${egp0(customerMetrics(c).outstanding)} due</small></div>`).join('');}
  if(invs.length){html+=`<div class="sr-group">Invoices</div>`+invs.map(i=>`<div class="sr-item" onclick="pickSearch('invoice',${i.id})"><span><b>${i.invoiceNumber}</b> <small>${esc(custName(i.customerId))}</small></span><small>${egp0(i.balance)} bal</small></div>`).join('');}
  if(cols.length){html+=`<div class="sr-group">Receipts</div>`+cols.map(c=>`<div class="sr-item" onclick="pickSearch('receipt',${c.id})"><span><b>${c.receiptNumber}</b> <small>${esc(custName(c.customerId))}</small></span><small>${egp0(c.amount)}</small></div>`).join('');}
  if(reps.length){html+=`<div class="sr-group">Sales Reps</div>`+reps.map(s=>`<div class="sr-item" onclick="pickSearch('rep',${s.id})"><span><b>${esc(s.name)}</b> <small>${s.employeeCode}</small></span></div>`).join('');}
  if(!html)html=`<div class="sr-item"><span class="muted">No matches for "${esc(q)}"</span></div>`;
  box.innerHTML=html;box.classList.add('open');
}
function pickSearch(type,id){
  document.getElementById('searchResults').classList.remove('open');document.getElementById('globalSearch').value='';
  if(type==='receipt'){go('collections');setTimeout(()=>openReceiptDetail(id),150);}
  else go(type,{id});
}

/*=================================== DATA EDITING (CRUD) ===================================*/
/* Every add/edit/delete mutates the base records then calls applyChange(), which re-runs the
   FIFO+commission+bonus engine so the change propagates across the entire application. */
function applyChange(msg,sub,nav){rebuild();renderNav();toast(msg,sub,'ok');FLASH_NEXT=true;if(nav)go(nav.page,nav.params);else renderView();}
function padD(n){return String(n).padStart(2,'0');}
function dateToInput(d){return d.getFullYear()+'-'+padD(d.getMonth()+1)+'-'+padD(d.getDate());}
function parseDateInput(v){const p=(v||'').split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2]):new Date(TODAY);}
function uniqueDiscounts(){return [...new Set(DB.commissionRules.map(r=>r.discountPercent))].sort((a,b)=>a-b);}
function confirmDialog(title,body,onYes,danger){
  openModal(`<div class="modal-h"><h3>${title}</h3><button class="x" data-close>&times;</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn ${danger?'danger':'primary'}" id="cfmYes">${danger?'Delete':'Confirm'}</button></div>`);
  document.getElementById('cfmYes').onclick=()=>{closeModal();onYes();};
}
function markInvalid(id,cond){const el=document.getElementById(id);if(!el)return cond;const row=el.closest('.form-row');if(row)row.classList.toggle('invalid',!!cond);return cond;}
// top-of-form inline error banner (created on demand inside a modal/drawer body)
function formError(id,msg){let el=document.getElementById(id);if(!el){const body=document.querySelector('.overlay.open .modal-b')||document.querySelector('.modal-b');if(!body)return;el=document.createElement('div');el.id=id;el.className='form-alert';body.insertBefore(el,body.firstChild);}el.textContent=msg;el.style.display='';}

function saveCustomer(id){
  const g=x=>{const el=document.getElementById(x);return el?el.value:'';};
  const name=g('cu_name').trim(),limit=+g('cu_limit');
  const repId=+g('cu_rep')||0, disc=+g('cu_disc')||0;
  const repOk=repId>0&&!!repById(repId);
  // Required-field validation BEFORE any Supabase write — nothing is saved unless the record is complete & valid.
  let bad=markInvalid('cu_name',!name);
  bad=markInvalid('cu_limit',!(limit>0))||bad;
  bad=markInvalid('cu_rep',!repOk)||bad;
  bad=markInvalid('cu_disc',!(disc>0))||bad;
  if(bad){
    const msg=!DB.salespersons.length?'Add at least one Sales Representative first (Sales Representatives → + Add), then assign the customer to them.'
      :(!repOk?'Choose a salesperson for this customer.':'Please complete the required fields highlighted below.');
    formError('cu_formErr',msg);toast('Check the form',msg,'warn');return;
  }
  clearFormError('cu_formErr');
  const data={name,salespersonId:repId,discountPercent:disc,creditLimit:limit,
    paymentTerms:+g('cu_terms')||30,city:g('cu_city')||'',status:g('cu_status')||'Active'};
  if(id){const c=custById(id);const oldRep=c.salespersonId;Object.assign(c,data);
    // Reassignment ownership rule (Business Rules): default keeps history with original rep.
    if(oldRep!==data.salespersonId && DB.ruleFlags.reassignMovesHistory){
      DB.invoices.filter(i=>i.customerId===id).forEach(i=>{i.salespersonId=data.salespersonId;securePush('invoice',i);});
      DB.collections.filter(x=>x.customerId===id).forEach(x=>{x.salespersonId=data.salespersonId;securePush('collection',x);});}
    securePush('customer',c);
    closeModal();applyChange('Customer updated',name+' saved'+(oldRep!==data.salespersonId&&!DB.ruleFlags.reassignMovesHistory?' · past commission kept with previous rep':''));
  }else{const nid=Math.max(0,...DB.customers.map(c=>c.id))+1;
    const nc=Object.assign({id:nid,code:nextCustomerCode(),contact:'+20 1'+randi(0,2)+' '+randi(1000,9999)+' '+randi(1000,9999)},data);
    DB.customers.push(nc);securePush('customer',nc);
    closeModal();applyChange('Customer added',name+' created',{page:'customer',params:{id:nid}});}
}
function deleteCustomer(id){if(!requireEdit())return;const c=custById(id);if(!c)return;const inv=DB.invoices.filter(i=>i.customerId===id).length;const col=DB.collections.filter(x=>x.customerId===id).length;
  confirmDialog('Delete Customer',`<div class="section-note" style="border-color:#f3c7c7;background:var(--red-bg);color:var(--red)">This permanently removes <b>${esc(c.name)}</b> and its <b>${inv} invoices</b> and <b>${col} collections</b>. All dependent figures will recompute.</div>`,
    ()=>{const invIds=DB.invoices.filter(i=>i.customerId===id).map(i=>i.id),colIds=DB.collections.filter(x=>x.customerId===id).map(x=>x.id);
      DB.invoices=DB.invoices.filter(i=>i.customerId!==id);DB.collections=DB.collections.filter(x=>x.customerId!==id);DB.customers=DB.customers.filter(x=>x.id!==id);
      if(secureMode()){invIds.forEach(i=>secureRemove('invoice',i));colIds.forEach(i=>secureRemove('collection',i));secureRemove('customer',id);}
      applyChange('Customer deleted',c.name+' and related records removed',{page:'customers'});},true);
}

function renderInvPicker(q){

function addInvLine(variantId){
  const v=variantById(variantId);if(!v)return;const existing=invEdit.lines.find(l=>l.variantId===variantId);
  if(existing){existing.qty+=1;}
  else invEdit.lines.push({productId:v.productId,variantId:v.id,sku:v.sku,color:v.color,size:v.size,qty:1,unitPrice:v.price,
    discountType:discountTypeOf(v.productId),customPct:(discountTypeOf(v.productId)==='Custom'?'':''),customCommPct:''});
  renderInvLines();
}
// per-line commercial calculation using the CURRENT editor state (customer basic discount + line type)
function invLineCompute(l){
  const c=custById(invEdit.customerId);
  const gross=Math.max(0,(+l.qty||0)*(+l.unitPrice||0));
  let pct;
  if(l.discountType==='Basic') pct=c?(+c.discountPercent||0):0;
  else if(l.discountType==='No Discount') pct=0;
  else pct=(l.customPct===''||l.customPct==null)?0:(+l.customPct||0);
  pct=Math.max(0,Math.min(100,pct));
  const discAmt=round(gross*pct/100,2), net=round(gross-discAmt,2);
  return {gross,pct,discAmt,net,commissionType:commissionTypeFor(l.discountType)};
}
function updLine(idx,field,val){const l=invEdit.lines[idx];if(!l)return;
  if(field==='customPct'||field==='customCommPct'){l[field]=val;} else {l[field]=Math.max(0,+val||0);}
  const c=invLineCompute(l);
  const set=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};
  set('ln_gross_'+idx,egp0(c.gross));set('ln_net_'+idx,egp0(c.net));set('ln_da_'+idx,'− '+egp0(c.discAmt));
  const v=variantById(l.variantId);const av=document.getElementById('ln_av_'+idx);
  if(av&&v)av.innerHTML=(l.qty>v.stock&&!DB.ruleFlags.allowNegativeStock)?`<span style="color:var(--red)">only ${v.stock} in stock</span>`:`<span class="muted">${v.stock} in stock</span>`;
  renderInvTotals();}
function removeInvLine(idx){invEdit.lines.splice(idx,1);renderInvLines();}
function renderInvLines(){
  const box=document.getElementById('iv_lines');if(!box)return;
  if(!invEdit.lines.length){box.innerHTML=`<div class="empty" style="padding:24px"><div class="e-ic">&#128230;</div><b>No items yet</b>Click “+ Add Item” to pick products from inventory</div>`;renderInvTotals();return;}
  box.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th style="width:64px">Qty</th><th style="width:96px" class="num">Unit Price</th><th style="width:130px">Discount</th><th class="num">Gross</th><th class="num">Net</th><th style="width:150px">Commission</th><th></th></tr></thead>
    <tbody>${invEdit.lines.map((l,idx)=>{const v=variantById(l.variantId);const c=invLineCompute(l);const cust=custById(invEdit.customerId);
      let discCell;
      if(l.discountType==='Basic'){const okB=cust&&basicDiscountValid(+cust.discountPercent);
        discCell=`<div><b>${c.pct}%</b> <span class="muted" style="font-size:10px">auto</span></div>${!okB?'<div style="font-size:10px;color:var(--red)">needs 20–25%</div>':''}`;}
      else if(l.discountType==='No Discount'){discCell=`<b>0%</b> <span class="muted" style="font-size:10px">fixed</span>`;}
      else {discCell=`<input class="matrix-inp" style="width:70px" type="number" min="0" max="100" placeholder="%" value="${l.customPct===''?'':l.customPct}" oninput="updLine(${idx},'customPct',this.value)"> %`;}

function saveInvoiceDoc(id,confirmNow){
  clearFormError('iv_formErr');
  const custId=+document.getElementById('iv_cust').value;
  if(markInvalid('iv_cust',!custId)){toast('Check the form','Select a customer','warn');return;}
  if(!invEdit.lines.length){toast('No items','Add at least one product line','warn');return;}
  const cust=custById(custId);
  if(!cust){formError('iv_formErr','Selected customer could not be found — please re-select it.');toast('Customer not found','Re-select the customer','warn');return;}
  if(!(cust.salespersonId>0&&repById(cust.salespersonId))){formError('iv_formErr','This customer has no valid salesperson assigned. Fix the customer first (assign a salesperson), then invoice them.');toast('No salesperson','Assign a salesperson to this customer first','warn');return;}
  // --- structural validation (always) ---
  const sErr=[];
  invEdit.lines.forEach(l=>{if(!(l.qty>0))sErr.push(l.sku+': quantity must be ≥ 1');if(!(l.unitPrice>0))sErr.push(l.sku+': unit price must be > 0');if(!variantById(l.variantId))sErr.push(l.sku+': product/variant missing');});
  if(sErr.length){formError('iv_formErr',sErr.slice(0,4).join(' · '));toast('Check the lines',sErr[0],'warn');return;}
  // --- confirm-time discount-model validation ---
  if(confirmNow){const cErr=confirmBlockers(invEdit.lines.map(l=>({...l,...invLineCompute(l)})),cust);
    if(cErr.length){formError('iv_formErr',cErr.slice(0,4).join(' · '));toast('Cannot confirm',cErr[0],'err');return;}}
  const invoiceDate=parseDateInput(document.getElementById('iv_date').value);
  const dueDate=parseDateInput(document.getElementById('iv_due').value);
  const notes=document.getElementById('iv_notes').value.trim();
  let gross=0,discT=0,net=0;invEdit.lines.forEach(l=>{const c=invLineCompute(l);gross+=c.gross;discT+=c.discAmt;net+=c.net;});
  const amount=round(net,2);
  let inv;
  if(id){inv=invById(id);Object.assign(inv,{customerId:custId,salespersonId:cust.salespersonId,invoiceDate,dueDate,amount,discount:0,notes});}
  else{const nid=Math.max(0,...DB.invoices.map(i=>i.id))+1;DB.seqInvoice++;
    inv={id:nid,invoiceNumber:'INV-'+DB.seqInvoice,customerId:custId,salespersonId:cust.salespersonId,invoiceDate,dueDate,amount,collected:0,balance:amount,status:'Open',
      docStatus:'Draft',discount:0,currency:'EGP',notes,stockPosted:false,confirmedBy:'',confirmedAt:'',cancelledBy:'',cancelledAt:''};
    DB.invoices.push(inv);}
  // replace lines (local) — store the full commercial SNAPSHOT so confirmed invoices never change later
  const oldLineIds=linesOf(inv.id).map(l=>l.id);
  DB.invoiceLines=DB.invoiceLines.filter(l=>l.invoiceId!==inv.id);
  const newLines=invEdit.lines.map(l=>{const c=invLineCompute(l);DB.seqLine++;
    const nl={id:DB.seqLine,invoiceId:inv.id,productId:l.productId,variantId:l.variantId,sku:l.sku,color:l.color,size:l.size,
      qty:l.qty,unitPrice:l.unitPrice,discountType:l.discountType,appliedDiscountPercent:c.pct,
      grossLineAmount:c.gross,discountAmount:c.discAmt,netLineTotal:c.net,commissionType:c.commissionType,
      lineDiscount:c.discAmt,lineTotal:c.net /* legacy-compat aliases */};
    nl._ccPct=(l.discountType!=='Basic')?l.customCommPct:''; // transient: optional custom-commission % entered now
    DB.invoiceLines.push(nl);return nl;});
  if(secureMode()){(async()=>{try{
    oldLineIds.forEach(lid=>secureRemove('line',lid));
    await sbUpsert('invoices',TMAP.invoices.to(inv));
    for(const nl of newLines){await sbUpsert('invoice_lines',TMAP.invoice_lines.to(nl));}
  }catch(e){toast('Cloud save failed',e.message,'err');}})();}
  closeModal();
  if(confirmNow){ if(!doConfirmInvoice(inv)){rebuild();renderNav();go('invoice',{id:inv.id});return;} }
  else { rebuild();renderNav(); }
  FLASH_NEXT=true;go('invoice',{id:inv.id});
  toast(id?'Invoice saved':'Invoice created',inv.invoiceNumber+(confirmNow?' · confirmed & stock posted':' · saved as Draft'),'ok');
}
// confirm-time blockers for a set of computed lines (used by editor + doConfirmInvoice)
function confirmBlockers(lines,cust){
  const e=[];
  if(lines.some(l=>l.discountType==='Basic')){
    if(!cust||!basicDiscountValid(+cust.discountPercent))e.push('Basic lines need a valid customer Basic Discount ('+BASIC_MIN+'–'+BASIC_MAX+'%)');
  }
  lines.filter(l=>l.discountType==='Custom').forEach(l=>{const p=(l.customPct===''||l.customPct==null)?NaN:+l.customPct;if(!(p>0))e.push(l.sku+' (Custom) needs a discount % > 0');});
  return e;
}
// posting: returns true if posted, false if blocked (kept Draft)
function doConfirmInvoice(inv){
  const lines=linesOf(inv.id);
  const cust=custById(inv.customerId);
  // discount-model confirmation blockers (Basic needs valid customer discount; Custom needs a % > 0)
  const cErr=confirmBlockers(lines.map(l=>({sku:l.sku,discountType:l.discountType,customPct:l.appliedDiscountPercent})),cust);
  if(cErr.length){toast('Cannot confirm',cErr.slice(0,4).join(' · '),'err');return false;}
  if(!DB.ruleFlags.allowNegativeStock){
    const short=lines.filter(l=>{const v=variantById(l.variantId);return v&&l.qty>v.stock;});
    if(short.length){toast('Not enough stock',short.map(l=>l.sku+' needs '+l.qty+', have '+variantById(l.variantId).stock).slice(0,4).join(' · '),'err');return false;}
  }
  if(!inv.stockPosted){
    lines.forEach(l=>applyMovement(l.variantId,'Sale / Invoice',0,l.qty,{invoiceId:inv.id,reference:inv.invoiceNumber,notes:'Invoice confirmed'}));
    inv.stockPosted=true;
  }
  inv.docStatus='Confirmed';inv.confirmedBy=auditUser();inv.confirmedAt=fmtDate(TODAY);
  securePush('invoice',inv);
  // Auto-create a Custom Commission per Custom / No-Discount line (Pending, or set if a % was entered now).
  lines.filter(l=>(l.commissionType||commissionTypeFor(l.discountType))==='Custom').forEach(l=>{
    if(DB.customCommissions.some(x=>x.invoiceLineId===l.id))return; // don't duplicate on re-confirm
    const base=lineNet(l);const pct=(l._ccPct===''||l._ccPct==null)?null:(+l._ccPct||0);
    const pending=!(pct>0);
    DB.seqCustom++;
    const cc=stampCreate({id:DB.seqCustom,salespersonId:inv.salespersonId,customerId:inv.customerId,invoiceId:inv.id,invoiceLineId:l.id,
      date:fmtDate(TODAY),type:'Percentage',baseAmount:base,percentage:pending?null:pct,
      amount:pending?0:round(base*pct/100,2),
      description:(pending?'Pending — ':'')+'Custom commission for '+l.sku+' ('+l.discountType+')',notes:'',
      status:pending?'Pending':'Approved'});
    DB.customCommissions.push(cc);securePush('custom',cc);
  });
  return true;
}
function confirmInvoice(id){
  if(!requirePerm('confirmInvoice','confirm invoices'))return;
  const inv=invById(id);if(!inv||inv.docStatus==='Confirmed')return;
  if(!doConfirmInvoice(inv)){return;}
  rebuild();renderNav();FLASH_NEXT=true;go('invoice',{id});
  toast('Invoice confirmed',inv.invoiceNumber+' posted · stock reduced & receivable created','ok');
}
function cancelInvoiceDoc(id){
  if(!requirePerm('cancelInvoice','cancel invoices'))return;
  const inv=invById(id);if(!inv||inv.docStatus!=='Confirmed')return;
  const hasColl=inv.collected>0.5;
  confirmDialog('Cancel / Reverse Invoice',`<div class="section-note" style="border-color:#f3c7c7;background:var(--red-bg);color:var(--red)">Reverse <b>${inv.invoiceNumber}</b> (${egp(inv.amount)})? Stock will be restored with reversal movements and this invoice will no longer count toward receivables.${hasColl?' <b>Note:</b> payments already applied ('+egp(inv.collected)+') will re-allocate FIFO to the customer\'s other open invoices.':''}</div>`,()=>{
    if(inv.stockPosted){linesOf(inv.id).forEach(l=>applyMovement(l.variantId,'Invoice Reversal',l.qty,0,{invoiceId:inv.id,reference:inv.invoiceNumber,notes:'Invoice cancelled'}));inv.stockPosted=false;}
    inv.docStatus='Cancelled';inv.cancelledBy=auditUser();inv.cancelledAt=fmtDate(TODAY);
    // Void the auto-created Custom Commissions for this invoice's lines (excluded from totals once Cancelled)
    DB.customCommissions.filter(x=>x.invoiceId===inv.id&&x.status!=='Cancelled').forEach(x=>{x.status='Cancelled';stampUpdate(x);securePush('custom',x);});
    securePush('invoice',inv);rebuild();renderNav();FLASH_NEXT=true;go('invoice',{id});
    toast('Invoice cancelled',inv.invoiceNumber+' reversed · stock restored','ok');
  },true);
}
function deleteInvoice(id){const inv=invById(id);
  if((inv.docStatus||'Confirmed')!=='Draft'){toast('Use Cancel','Only Draft invoices can be deleted. Cancel a confirmed invoice to reverse it.','warn');return;}
  if(!requirePerm('editInvoice','delete invoices'))return;
  confirmDialog('Delete Draft Invoice',`<div class="section-note" style="border-color:#f3c7c7;background:var(--red-bg);color:var(--red)">Remove draft <b>${inv.invoiceNumber}</b>? No stock or receivable was posted for a draft.</div>`,
    ()=>{linesOf(id).forEach(l=>secureRemove('line',l.id));DB.invoiceLines=DB.invoiceLines.filter(l=>l.invoiceId!==id);
      DB.invoices=DB.invoices.filter(i=>i.id!==id);secureRemove('invoice',id);applyChange('Draft deleted',inv.invoiceNumber+' removed',{page:'invoices'});},true);
}

async function cloudPush(initial){

// Background poll worker: fetch silently, compare, and refresh ONLY when data actually changed.
async function secureSyncTick(){
  if(isUserBusy())return;                 // never disturb an open form/modal/drawer or a focused field
  await ensureFreshToken();               // JWT refresh stays independent (also runs on its own timer)
  let rows;
  try{
    rows=await Promise.all([
      sbGet('salespersons'),sbGet('customers'),sbGet('invoices'),sbGet('collections'),sbGet('commission_rules'),sbGet('bonus_rules'),
      sbGet('products').catch(()=>[]),sbGet('product_variants').catch(()=>[]),sbGet('inventory_movements').catch(()=>[]),sbGet('invoice_lines').catch(()=>[]),sbGet('custom_commissions').catch(()=>[])]);
  }catch(e){ setCloudStatus('error',e.message); return; }
  const [sp,cu,iv,co,cr,br,pr,pv,im,il,cc]=rows;
  const inc={salespersons:sp.map(TMAP.salespersons.from),customers:cu.map(TMAP.customers.from),invoices:iv.map(TMAP.invoices.from),
    collections:co.map(TMAP.collections.from),
    commissionRules:cr.length?cr.map(TMAP.commission_rules.from):DB.commissionRules,
    bonusRules:br.length?br.map(TMAP.bonus_rules.from):DB.bonusRules,
    products:pr.map(TMAP.products.from),productVariants:pv.map(TMAP.product_variants.from),
    inventoryMovements:im.map(TMAP.inventory_movements.from),invoiceLines:il.map(TMAP.invoice_lines.from),
    customCommissions:cc.map(TMAP.custom_commissions.from)};
  setCloudStatus('live');                 // healthy poll — indicator stays "Live sync", no flashing
  if(signatureOfArrays(inc)===lastDataSig)return;   // nothing changed → render NOTHING
  if(isUserBusy())return;                 // user started interacting during the fetch → wait for next tick
  // apply the changed data, then do the smallest safe refresh
  DB.salespersons=inc.salespersons;DB.customers=inc.customers;DB.invoices=inc.invoices;DB.collections=inc.collections;
  if(cr.length)DB.commissionRules=inc.commissionRules; if(br.length)DB.bonusRules=inc.bonusRules;
  DB.products=inc.products;DB.productVariants=inc.productVariants;DB.inventoryMovements=inc.inventoryMovements;
  DB.invoiceLines=inc.invoiceLines;DB.customCommissions=inc.customCommissions;
  applySeqCounters();
  suppressPush=true;rebuild();suppressPush=false;   // rebuild()→persist() refreshes lastDataSig
  silentRerender();
}

function parseCSV(text){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[];let field='',row=[],inq=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inq){if(ch==='"'){if(text[i+1]==='"'){field+='"';i++;}else inq=false;}else field+=ch;continue;}
    if(ch==='"'){inq=true;continue;}
    if(ch===','){row.push(field);field='';continue;}
    if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';continue;}
    field+=ch;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function csvToObjects(text){const rows=parseCSV(text);if(rows.length<1)return[];
  const hd=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,''));
  return rows.slice(1).map(r=>{const o={};hd.forEach((h,i)=>o[h]=(r[i]||'').trim());return o;});}
function csvNum(v){if(v==null)return 0;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function parseAnyDate(v){if(!v)return new Date(NaN);if(/^\d{4}-\d{1,2}-\d{1,2}/.test(v)){const p=v.slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
  const m=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);return new Date(v);}
function matchRep(v){if(!v)return null;const q=v.trim().toLowerCase();return DB.salespersons.find(s=>s.employeeCode.toLowerCase()===q||s.name.toLowerCase()===q)||null;}
function matchCust(v){if(!v)return null;const q=v.trim().toLowerCase();return DB.customers.find(c=>c.code.toLowerCase()===q||c.name.toLowerCase()===q)||null;}

const IMPORT_TYPES={
  salespeople:{label:'Salespeople',headers:['name','employeeCode','salesTarget','collectionTarget'],
    template:'name,employeeCode,salesTarget,collectionTarget\nAhmed Hassan,SP-01,1200000,1000000\nMona Fathy,SP-02,1100000,900000\n',
    clears:['salespersons','customers','invoices','collections'],
    handle:o=>{if(!o.name)throw new Error('name is required');
      const id=Math.max(0,...DB.salespersons.map(s=>s.id))+1;
      DB.salespersons.push({id,name:o.name,employeeCode:o.employeecode||nextRepCode(),salesTarget:csvNum(o.salestarget)||1000000,collectionTarget:csvNum(o.collectiontarget)||900000,status:'Active'});}},
  customers:{label:'Customers',headers:['code','name','salesperson','discountPercent','creditLimit','paymentTerms','city'],
    template:'code,name,salesperson,discountPercent,creditLimit,paymentTerms,city\nCUST-001,Nile Garments,Ahmed Hassan,20,800000,30,Cairo\nCUST-002,Cairo Fashion Factory,SP-02,25,1200000,45,Giza\n',
    clears:['customers','invoices','collections'],
    handle:o=>{if(!o.name)throw new Error('name is required');
      const rep=matchRep(o.salesperson);if(!rep)throw new Error('salesperson "'+o.salesperson+'" not found (add salespeople first)');
      const id=Math.max(0,...DB.customers.map(c=>c.id))+1;
      DB.customers.push({id,code:o.code||nextCustomerCode(),name:o.name,salespersonId:rep.id,discountPercent:csvNum(o.discountpercent)||0,creditLimit:csvNum(o.creditlimit)||DB.creditSettings.defaultCreditLimit,paymentTerms:csvNum(o.paymentterms)||DB.creditSettings.defaultTerms,city:o.city||'',contact:o.contact||'',status:'Active'});}},
  invoices:{label:'Invoices',headers:['invoiceNumber','customer','invoiceDate','dueDate','paymentTerms','amount'],
    template:'invoiceNumber,customer,invoiceDate,dueDate,paymentTerms,amount\nINV-1001,CUST-001,2026-01-05,2026-02-04,,120000\nINV-1002,Nile Garments,2026-01-20,,45,80000\n',
    clears:['invoices','collections'],
    handle:o=>{const cust=matchCust(o.customer);if(!cust)throw new Error('customer "'+o.customer+'" not found (add customers first)');
      const amt=csvNum(o.amount);if(!(amt>0))throw new Error('amount must be > 0');
      const idt=parseAnyDate(o.invoicedate);if(isNaN(idt))throw new Error('invalid invoiceDate (use YYYY-MM-DD)');
      const due=o.duedate?parseAnyDate(o.duedate):addDays(idt,csvNum(o.paymentterms)||cust.paymentTerms);
      const id=Math.max(0,...DB.invoices.map(i=>i.id))+1;
      let num=o.invoicenumber;if(!num){DB.seqInvoice++;num='INV-'+DB.seqInvoice;}
      DB.invoices.push({id,invoiceNumber:num,customerId:cust.id,salespersonId:cust.salespersonId,invoiceDate:idt,dueDate:due,amount:amt,collected:0,balance:amt,status:'Open'});}},
  collections:{label:'Collections',headers:['receiptNumber','customer','collectionDate','amount','paymentMethod','reference'],
    template:'receiptNumber,customer,collectionDate,amount,paymentMethod,reference\nRCPT-1001,CUST-001,2026-02-01,50000,Bank Transfer,TRX-98211\nRCPT-1002,Nile Garments,2026-03-10,30000,Cheque,CHQ-4410\n',
    clears:['collections'],
    handle:o=>{const cust=matchCust(o.customer);if(!cust)throw new Error('customer "'+o.customer+'" not found');
      const amt=csvNum(o.amount);if(!(amt>0))throw new Error('amount must be > 0');
      const cdt=parseAnyDate(o.collectiondate);if(isNaN(cdt))throw new Error('invalid collectionDate (use YYYY-MM-DD)');
      const id=Math.max(0,...DB.collections.map(c=>c.id))+1;
      let num=o.receiptnumber;if(!num){DB.seqReceipt++;num='RCPT-'+DB.seqReceipt;}
      DB.collections.push({id,receiptNumber:num,customerId:cust.id,salespersonId:cust.salespersonId,collectionDate:cdt,amount:amt,paymentMethod:o.paymentmethod||'Bank Transfer',bankAccount:o.bankaccount||'',reference:o.reference||'',notes:o.notes||''});}}
};
let importCtx={type:'salespeople',replace:false};
function openImportModal(){
  importCtx={type:'salespeople',replace:false};
  openModal(`
    <div class="modal-h"><div><h3>Import Real Data (CSV)</h3><div class="sub">Load your own salespeople, customers, invoices &amp; collections</div></div><button class="x" data-close>&times;</button></div>
    <div class="modal-b">
      <div class="section-note">Recommended order: <b>1) Salespeople → 2) Customers → 3) Invoices → 4) Collections.</b> Customers link to a salesperson by name or code; invoices &amp; collections link to a customer by code or name. Dates use <b>YYYY-MM-DD</b>.</div>
      <div class="form-grid">
        <div class="form-row"><label>What are you importing?</label>
          <select id="imp_type">${Object.keys(IMPORT_TYPES).map(k=>`<option value="${k}">${IMPORT_TYPES[k].label}</option>`).join('')}</select></div>
        <div class="form-row"><label>&nbsp;</label><button class="btn" onclick="downloadTemplate()">&#8681; Download ${IMPORT_TYPES.salespeople.label} template</button></div>
      </div>
      <div id="imp_hint" class="section-note" style="margin-top:12px"></div>
      <label style="display:flex;align-items:center;gap:9px;font-size:12.5px;margin:6px 0 14px"><input type="checkbox" id="imp_replace"> Replace existing records of this type (and dependent data)</label>
      <div style="display:flex;gap:9px"><button class="btn primary" onclick="document.getElementById('csvFile').click()">&#128193; Choose CSV file &amp; Import</button></div>
      <div id="imp_result" style="margin-top:14px"></div>
    </div>
    <div class="modal-f"><button class="btn" data-close>Close</button></div>`,'lg');
  const upd=()=>{const t=IMPORT_TYPES[importCtx.type];
    document.querySelector('[onclick="downloadTemplate()"]').innerHTML='&#8681; Download '+t.label+' template';
    document.getElementById('imp_hint').innerHTML='<b>Columns:</b> '+t.headers.join(', ')+'. First row must be the header. Extra columns are ignored.';};
  document.getElementById('imp_type').onchange=e=>{importCtx.type=e.target.value;upd();};
  document.getElementById('imp_replace').onchange=e=>{importCtx.replace=e.target.checked;};
  upd();
}
function downloadTemplate(){
  const t=IMPORT_TYPES[importCtx.type];
  const blob=new Blob([t.template],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=importCtx.type+'-template.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Template downloaded','Fill '+importCtx.type+'-template.csv and import it','ok');
}
function runCsvImport(file){
  const t=IMPORT_TYPES[importCtx.type];const rd=new FileReader();
  rd.onload=()=>{
    let objs;try{objs=csvToObjects(rd.result);}catch(e){toast('Parse error',e.message,'err');return;}
    if(!objs.length){toast('Empty file','No data rows found','warn');return;}
    if(importCtx.replace){t.clears.forEach(key=>{DB[key]=[];});DB.commissionStatusOverride={};}
    let added=0;const errs=[];
    objs.forEach((o,i)=>{try{t.handle(o);added++;}catch(e){errs.push('Row '+(i+2)+': '+e.message);}});
    rebuild();renderNav();
    if(secureMode()&&added){const tbl=importCtx.type==='salespeople'?'salespersons':importCtx.type;
      const map={salespersons:'salespersons',customers:'customers',invoices:'invoices',collections:'collections'}[tbl];
      if(map)sbUpsert(map,DB[tbl==='salespersons'?'salespersons':tbl].map(TMAP[map].to)).catch(e=>toast('Cloud sync failed',e.message,'err'));}
    const box=document.getElementById('imp_result');
    if(box)box.innerHTML=`<div class="section-note" style="border-color:${errs.length?'#f3c7c7':'#bfe6cf'};background:${errs.length?'var(--red-bg)':'var(--green-bg)'};color:${errs.length?'var(--red)':'var(--green)'}">
      <b>Imported ${added} ${t.label.toLowerCase()}.</b>${errs.length?` ${errs.length} row(s) skipped:<br>`+errs.slice(0,8).map(esc).join('<br>')+(errs.length>8?`<br>…and ${errs.length-8} more`:''):' All rows loaded successfully.'}</div>`;
    toast(added?'Import complete':'Nothing imported',added+' added'+(errs.length?', '+errs.length+' skipped':''),added?'ok':'warn');
  };
  rd.onerror=()=>toast('Read error','Could not read the file','err');
  rd.readAsText(file);
}
function startEmpty(){
  confirmDialog('Start Empty Workspace','<div class="section-note">This removes all <b>demo customers, invoices and collections</b> so you can enter or import your own data. Salespeople, rules and settings are kept — edit or replace them as needed.</div>',()=>{
    DB.customers=[];DB.invoices=[];DB.collections=[];DB.commissionStatusOverride={};
    rebuild();renderNav();closeDrawer();go('customers');
    toast('Empty workspace ready','Add customers manually, or use "Import CSV" to bulk-load your data','ok');
  },true);
}

      <div class="flow"><span class="badge b-red">Overdue ${daysBetween(i.dueDate,TODAY)}d</span></div>
      <div class="amt-tag"><b>${egp(i.balance)}</b></div></div>`).join(''));
};
const ROLES_CYCLE=[['Mostafa Adel','Finance Manager','Finance Mgr'],['Sara Fouad','Administrator','Admin'],['Ahmed Hassan','Sales Representative','Sales Rep'],['Nourhan Adel','Sales Manager','Sales Mgr'],['Laila Mansour','Viewer','Viewer']];

loadSession();
go('dashboard');
// start live sync if a Supabase project is already configured (baked-in or saved on this device)
if(cloudConfigured()){cloudOn=true;setCloudStatus('connecting');
  if(secureMode()){
    if(SESSION){secureLoad().then(()=>{startCloudPoll();renderNav();if(SCOPE)go('rep',{id:SCOPE});else go('dashboard');}).catch(()=>{showLoginIfNeeded();});}
    else showLoginIfNeeded();
  }else{
    cloudPull(true).then(ok=>{ if(ok)startCloudPoll();
      if(authRequired()){ if(SESSION){resolveRole();renderNav();if(SCOPE)go('rep',{id:SCOPE});else go('dashboard');} else showLoginIfNeeded(); }
    });
  }
}else setCloudStatus('local');
